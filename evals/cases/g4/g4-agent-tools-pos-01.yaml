id: g4-agent-tools-pos-01
gate: G4
domain: ai_agent_security
title: Agent 可呼叫 shell 與任意檔案寫入
input:
  kind: code
  language: python
  path: agent/tools.py
  snippet: |
    from agent_sdk import Agent, tool

    @tool
    def execute_sql(query: str) -> list:
        return db.execute(query).fetchall()

    agent = Agent(tools=[search_docs, execute_sql])
expected:
  should_flag: true
  control_id: VS-G4-AGENT-TOOL-ALLOWLIST
  rule_id: vibesec.g4.agent-tool-overexposure
  policy_tier: blocking
held_out: false
