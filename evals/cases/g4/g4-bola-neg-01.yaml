id: g4-bola-neg-01
gate: G4
domain: authorization
title: 已綁定 owner 的查詢不應命中
input:
  kind: code
  language: python
  # 必須是路由處理函式：G4 靜態檢查只看路由內的查詢。以前少了 @app.get，規則根本不會檢查這段，反例永遠「正確」
  snippet: |
    @app.get("/notes/{note_id}")
    def get_note(note_id: int, current_user=Depends(get_current_user), session=Depends(get_session)):
        note = session.query(Note).filter(
            Note.id == note_id, Note.owner_id == current_user.id).first()
        return note
expected:
  should_flag: false
  control_id: ASVS5-V8.2
  rule_id: vibesec.g4.missing-owner-filter
  policy_tier: advisory
held_out: true
