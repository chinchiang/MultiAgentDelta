id: g4-single-mw-fastapi-neg-01
gate: G4
domain: authorization
title: "FastAPI middleware 與 router 依賴兩層都檢查授權 / FastAPI checks authorization in both middleware and router dependencies"
input:
  kind: code
  language: python
  path: app/main.py
  snippet: |
    from fastapi import APIRouter, Depends, FastAPI, Request
    from fastapi.responses import JSONResponse

    app = FastAPI()
    api = APIRouter(prefix="/api", dependencies=[Depends(require_user)])

    @app.middleware("http")
    async def require_login(request: Request, call_next):
        if request.url.path.startswith("/api") and not request.headers.get("authorization"):
            return JSONResponse({"detail": "unauthorized"}, status_code=401)
        return await call_next(request)

    @api.get("/notes/{note_id}")
    def read_note(note_id: int, db=Depends(get_db)):
        return db.get_note(note_id)

    app.include_router(api)
expected:
  should_flag: false
  control_id: ASVS5-V8.3
  rule_id: vibesec.g4.single-middleware-authz
  policy_tier: advisory
held_out: false
notes: "router 層的 Depends(require_user) 是第二道授權檢查，不屬於單層 middleware。 / Router Depends(require_user) provides a second authorization check."
