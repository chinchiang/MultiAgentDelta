title: Supabase migration 建表後同檔啟用 RLS 並建立 policy
input:
  kind: iac
  path: supabase/migrations/002_notes.sql
  snippet: |
    create table notes (
      id bigint generated always as identity primary key,
      owner_id uuid not null references auth.users (id),
      body text not null
