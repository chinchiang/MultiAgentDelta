id: g4-owner-pos-03
gate: G4
domain: authorization
title: "SQLAlchemy session.get(Model, id) 未綁定當前主體 / SQLAlchemy session.get(Model, id) lacks principal binding"
input:
  kind: code
  language: python
  snippet: |
    @app.get("/notes/{nid}")
    def get_note(nid: int, db=Depends(get_db)):
        return db.get(models.Note, nid)
expected:
  should_flag: true
  control_id: ASVS5-V8.2
  rule_id: vibesec.g4.missing-owner-filter
  policy_tier: advisory
held_out: false
notes: "收緊 $DB.get($MODEL, $ID) 後仍須命中：$MODEL 是類別（含模組前綴）。 / Narrowing $DB.get($MODEL, $ID) must still match class-valued $MODEL, including module-qualified classes."
