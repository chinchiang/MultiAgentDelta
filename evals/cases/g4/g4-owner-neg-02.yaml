id: g4-owner-neg-02
gate: G4
domain: data_integrity
title: "查詢以 owner_id 綁定當前主體 / The query binds owner_id to the current principal"
input:
  kind: code
  path: app/repo.py
  snippet: |
    @app.get("/notes/{nid}")
    def get_note(nid: int, user=Depends(current_user), db=Depends(get_db)):
        return db.query(Note).filter(Note.id == nid, Note.owner_id == user.id).one()
expected:
  should_flag: false
  control_id: ASVS5-V8.2
  rule_id: vibesec.g4.missing-owner-filter
  policy_tier: advisory
held_out: false
