id: g4-single-mw-fastapi-pos-01
gate: G4
domain: authorization
title: FastAPI 只在 app middleware 檢查授權，路由只有資料庫依賴
input:
  kind: code
  language: python
  path: app/main.py
  snippet: |
    from fastapi import Depends, FastAPI, Request
    from fastapi.responses import JSONResponse

    app = FastAPI()

    @app.middleware("http")
    async def require_login(request: Request, call_next):
        if request.url.path.startswith("/api") and not request.headers.get("authorization"):
            return JSONResponse({"detail": "unauthorized"}, status_code=401)
        return await call_next(request)

    @app.get("/api/notes/{note_id}")
    def read_note(note_id: int, db=Depends(get_db)):
        return db.get_note(note_id)
expected:
  should_flag: true
  control_id: ASVS5-V8.3
  rule_id: vibesec.g4.single-middleware-authz
  policy_tier: advisory
held_out: false
notes: 授權只有 middleware 一層；路徑前綴比對差異或路由掛到其他 app 時就沒有檢查。Depends(get_db) 不是授權依賴。
