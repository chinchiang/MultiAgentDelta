title: 轉帳工具執行前先取得人工確認
input:
  kind: code
  language: python
  path: agent/payments_tools.py
  snippet: |
    from mcp.server.fastmcp import FastMCP

    mcp = FastMCP("payments")

    @mcp.tool()
    def transfer_funds(from_account: str, to_account: str, amount: int) -> str:
        ticket = approvals.request(action="transfer", amount=amount, to=to_account)
        if not ticket.wait_until_approved(timeout_s=900):
            return "rejected"
        ledger.transfer(from_account, to_account, amount)
        return "done"
