id: g1-unsupported-incomplete-01
gate: G1
domain: dependency
title: 受驗樹只有不支援的生態系清單時不得判定為放行
input:
  kind: tree
  integration: g1-tree   # run_evals.py：g1_slopcheck.py --target 全量掃描 files 寫出的受驗樹
  files:
    go.mod: |
      module x

      go 1.22

      require github.com/nonexistent-zzz/hallucinated-pkg v1.0.0
    Cargo.toml: |
      [package]
      name = "x"
      version = "0.1.0"

      [dependencies]
      hallucinated-zzz = "9.9.9"
expected:
  should_flag: true
  control_id: ASVS5-V15.2
  rule_id: vibesec.g1.hallucinated-package
  policy_tier: blocking
  gate_status: incomplete
  coverage:
    VS-G1-SLOPSQUAT: untested
    VS-G1-COOLDOWN: untested
    VS-G1-INSTALL-HOOK: untested
  status_reason_contains: 生態系尚未支援
held_out: false
notes: go.mod／Cargo.toml 屬於尚未支援的生態系，其中的套件沒有被檢查 → gate_status=incomplete（#316；以前記 pass）。
