id: g5-graphql-neg-01
gate: G5
domain: general_vulnerabilities
title: GraphQL introspection 已關閉，回 GraphQL 格式的拒絕
input:
  kind: http
  target_app: vulnapp-patched   # VIBESEC_VULNAPP_MODE=patched 可重現；run_evals.py 以本機已修補靶場實測
  target: /graphql
  steps:
  - 'POST /graphql {"query":"{__schema{types{name}}}"} -> 400 {"errors":[…]}，不含 __schema'
expected:
  should_flag: false
  control_id: ASVS5-V13.4
  rule_id: vibesec.g5.graphql-introspection
  policy_tier: advisory
held_out: false
notes: 只有 GraphQL 格式的拒絕（errors／data）才判 pass；401／403／非 GraphQL 回應記 untested，不算 TN。
