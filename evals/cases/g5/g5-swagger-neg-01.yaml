id: g5-swagger-neg-01
gate: G5
domain: application_architecture
title: API 文件不對匿名使用者開放
input:
  kind: http
  target_app: vulnapp-patched   # VIBESEC_VULNAPP_MODE=patched 可重現；run_evals.py 以本機已修補靶場實測
  target: /docs
  steps:
  - GET /docs、/redoc -> 404（已關閉）
  - GET /openapi.json 未帶 token -> 401（文件只給登入者）
expected:
  should_flag: false
  control_id: ASVS5-V13.4
  rule_id: vibesec.g5.swagger-exposed
  policy_tier: advisory
held_out: false
notes: 文件路徑至少要有一個得到 HTTP 回應才判 pass（全部連不上記 untested）。debug_stacktrace 探針取 spec 時帶 token A，所以修補模式仍能列出 POST 端點做型別混淆測試。
