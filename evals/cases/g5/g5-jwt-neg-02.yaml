id: g5-jwt-neg-02
gate: G5
domain: authentication
title: 已修補：固定 RS256 驗章，拒絕 HS256 演算法混淆
input:
  kind: http
  target_app: vulnapp-patched
  target: /me
  steps:
    - 從 /.well-known/jwks.json 取 RSA 公鑰並轉為 PEM
    - 以 PEM 當 HMAC 金鑰、header alg=HS256 重簽同一 payload
    - GET /me with 偽造 token -> 401
expected:
  should_flag: false
  control_id: ASVS5-V9.1
  rule_id: vibesec.g5.jwt-alg-confusion
  policy_tier: advisory
held_out: true
notes: examples/vulnapp 以 VIBESEC_VULNAPP_MODE=patched 啟動（jwt.decode algorithms=[RS256]）。g5-jwt-pos-02 的修補後反例。
