id: g2-secret-pos-02
gate: G2
domain: secret_exposure
title: "硬編碼的 JWT 簽章密鑰 / A hardcoded JWT signing secret"
input:
  kind: code
  language: python
  snippet: |
    JWT_SECRET = "{{FAKE_JWT_SECRET}}"  # 佔位：run_evals.py 執行時展開為合成密鑰，repo 內不放密鑰形字串
expected:
  should_flag: true
  control_id: ASVS5-V13.1
  rule_id: vibesec.g2.hardcoded-secret
  policy_tier: blocking
held_out: false
notes: "與 g2-secret-neg-02 成對：synthetic 例外不得放過真正的高熵密鑰。 / Paired with g2-secret-neg-02: the synthetic exception must not exempt real high-entropy secrets."
