id: g0-trifecta-pos-02
gate: G0
domain: application_architecture
title: "讀 email + 讀私有 repo + 可發 HTTP 的 agent / An agent reads email and private repositories and can send HTTP requests"
input:
  kind: config
  threat_model:
    agents:
      - id: c-inbox-agent
        tools: [read_inbox, read_private_repo, http_fetch]   # email = 不可信輸入、私有 repo = 私有資料、http_fetch = 外傳
        accesses_private_data: true
        exposed_to_untrusted_content: true
        can_communicate_externally: true
        mitigations: []
        trifecta_leg_cut: null
expected:
  should_flag: true
  control_id: VS-G0-LETHAL-TRIFECTA
  rule_id: vibesec.g0.lethal-trifecta-open
  policy_tier: blocking
held_out: true
notes: "email 為不可信輸入、repo 為私有資料、http_fetch 為外傳通道。 / Email is untrusted input, repositories contain private data, and http_fetch enables exfiltration."
