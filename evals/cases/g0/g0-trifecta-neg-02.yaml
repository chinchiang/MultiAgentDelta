id: g0-trifecta-neg-02
gate: G0
domain: application_architecture
title: 三要素齊備但外傳通道受 allow-list 與 HITL 阻斷
input:
  kind: config
  threat_model:
    agents:
      - id: c-inbox-agent
        tools: [read_inbox, read_private_repo, http_fetch]   # http_fetch 只允許 api.internal，且需人工核准
        accesses_private_data: true
        exposed_to_untrusted_content: true
        can_communicate_externally: true
        high_impact_tools: [http_fetch]
        mitigations: [egress_allowlist, human_in_the_loop]
        trifecta_leg_cut: external_comms
        # 切腳也要可驗證（docs/01 §5），且只採信 deny：ask 是 human_in_the_loop、不算切腳（run_evals 以本 repo 為根目錄）
        mitigation_evidence:
          egress_allowlist:
            - kind: claude_permission
              ref: evals/fixtures/g0/egress-deny-settings.json
              rules: [WebFetch, "Bash(curl *)", "Bash(wget *)"]
              covers: {http_fetch: [WebFetch, "Bash(curl *)", "Bash(wget *)"]}
          human_in_the_loop:
            - kind: claude_permission
              ref: .claude/settings.json
              rules: ["Bash(curl *api.github.com*)", "Bash(gh api *)"]
              covers: {http_fetch: ["Bash(curl *api.github.com*)", "Bash(gh api *)"]}
expected:
  should_flag: false
  control_id: VS-G0-LETHAL-TRIFECTA
  rule_id: vibesec.g0.lethal-trifecta-open
  policy_tier: blocking
held_out: false
notes: 外傳通道已被切斷（allow-list 僅內部 + 人工核准），且切腳的 egress_allowlist 附可驗證的 deny 證據（HITL 的 ask 證據只是補償），預期 G0 不 blocking；若審查者意見分歧應保留少數意見。
