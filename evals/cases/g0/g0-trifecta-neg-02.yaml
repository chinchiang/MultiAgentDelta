id: g0-trifecta-neg-02
gate: G0
domain: application_architecture
title: "三要素齊備但外傳通道受 allow-list 與 HITL 阻斷 / The trifecta's outbound channel is blocked by an allowlist and HITL"
input:
  kind: config
  threat_model:
    agents:
      - id: c-inbox-agent
        tools: [read_inbox, read_private_repo, http_fetch]   # http_fetch 只允許 api.internal，且需人工核准
        accesses_private_data: true
        exposed_to_untrusted_content: true
        can_communicate_externally: true
        high_impact_tools: [http_fetch]
        mitigations: [egress_allowlist, human_in_the_loop]
        trifecta_leg_cut: external_comms
expected:
  should_flag: false
  control_id: VS-G0-LETHAL-TRIFECTA
  rule_id: vibesec.g0.lethal-trifecta-open
  policy_tier: blocking
held_out: false
notes: "外傳通道已被切斷（allow-list 僅內部 + 人工核准），預期 G0 不 blocking；若審查者意見分歧應保留少數意見。 / An internal-only allowlist removes exfiltration; human approval supplements it. G0 should not block; preserve reviewer dissent."
