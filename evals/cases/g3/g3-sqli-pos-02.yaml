id: g3-sqli-pos-02
gate: G3
domain: general_vulnerabilities
title: sqlite 的 db.get 以樣板字串帶入 req.query（SQLi）
input:
  kind: code
  language: javascript
  snippet: |
    app.get('/users', async (req, res) => {
      const row = await db.get(`SELECT * FROM users WHERE name = '${req.query.name}'`);
      res.json(row);
    });
expected:
  should_flag: true
  control_id: ASVS5-V1.2
  rule_id: vibesec.g3.sql-string-concat
  policy_tier: blocking
held_out: false
notes: 與 g3-sqli-neg-02 成對：收緊 .get sink 後，含 SQL 的參數仍要命中。
