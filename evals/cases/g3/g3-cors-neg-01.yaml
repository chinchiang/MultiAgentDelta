id: g3-cors-neg-01
gate: G3
domain: general_vulnerabilities
title: API Gateway v2 的 CORS 只允許固定前端網域
input:
  kind: iac
  path: infra/api.tf
  snippet: |
    resource "aws_apigatewayv2_api" "api" {
      name          = "notes-api"
      protocol_type = "HTTP"
      cors_configuration {
        allow_origins     = ["https://app.example.com"]
        allow_methods     = ["GET", "POST"]
        allow_credentials = true
      }
    }
expected:
  should_flag: false
  control_id: ASVS5-V3.3
  rule_id: vibesec.g3.cors-wildcard
  policy_tier: advisory
held_out: false
notes: 與 g3-cors-pos-01 同一資源，只把 allow_origins 改成白名單，量測 CKV2_VIBESEC_2 不誤報。
