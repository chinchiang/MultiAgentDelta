id: g3-sql-fstring-pos-01
gate: G3
domain: general_vulnerabilities
title: cursor.execute 以 f-string 組 SQL
input:
  kind: code
  path: app/repo.py
  snippet: |
    def find_notes(conn, owner: str):
        cur = conn.cursor()
        cur.execute(f"SELECT id, body FROM notes WHERE owner = '{owner}'")
        return cur.fetchall()
expected:
  should_flag: true
  control_id: ASVS5-V1.2
  rule_id: vibesec.g3.sql-fstring-execute
  policy_tier: blocking
held_out: false
notes: 不需要污點來源；只要 SQL 執行點用 f-string 組字串即命中。
