id: g3-xss-py-neg-01
gate: G3
domain: xss
title: FastAPI 路由先以 html.escape 編碼再輸出 HTML
input:
  kind: code
  path: app/main.py
  snippet: |
    import html
    from fastapi import FastAPI
    from fastapi.responses import HTMLResponse

    app = FastAPI()

    @app.get("/greet")
    def greet(name: str):
        return HTMLResponse("<h1>Hello " + html.escape(name) + "</h1>")
expected:
  should_flag: false
  control_id: ASVS5-V1.1
  rule_id: vibesec.g3.xss-unescaped-render-py
  policy_tier: advisory
held_out: false
notes: 與 g3-xss-py-pos-01 成對；html.escape 是規則的 sanitizer。
