# G0 威脅模型輸入模板 — 複製到 docs/templates/threat-model.yaml 或專案根目錄並填寫
# 符合 schemas/threat-model.schema.json。填妥後由 G0 閘門驗證，並據以決定 risk_tier。
# 詳見 docs/01-g0-threat-modeling.md。

system:
  name: example-project
  description: 一句話描述系統用途與主要使用者。
  exposure: public            # internal | partner | public
  data_sensitivity: pii       # none | business | pii | sensitive_pii_or_secrets
  methodologies: [STRIDE, MAESTRO]   # 隱私領域再加 LINDDUN

assets:
  - id: a-user-notes
    name: 使用者筆記
    sensitivity: pii          # public | internal | confidential | pii | secret
    store: postgres.notes
  - id: a-api-keys
    name: 第三方 API 金鑰
    sensitivity: secret
    store: secrets-manager

components:
  - { id: c-browser,  name: 瀏覽器 SPA,      kind: browser,         zone: z-public }
  - { id: c-api,      name: FastAPI 後端,     kind: api,             zone: z-app,    maestro_layer: 6 }
  - { id: c-db,       name: Postgres,        kind: db,              zone: z-data }
  - { id: c-llm,      name: 對話 LLM,         kind: llm,             zone: z-app,    maestro_layer: 1 }
  - { id: c-agent,    name: 客服 Agent,       kind: agent,           zone: z-app,    maestro_layer: 3 }
  - { id: c-web,      name: 外部網頁擷取工具,  kind: tool,            zone: z-app }

flows:
  - { from: c-browser, to: c-api, data: [credentials, notes], protocol: https, authenticated: true,  crosses_boundary: true }
  - { from: c-api,     to: c-db,  data: [notes],              protocol: tcp-tls, authenticated: true, crosses_boundary: true }
  - { from: c-agent,   to: c-web, data: [url],                protocol: https, authenticated: false, crosses_boundary: true }
  - { from: c-agent,   to: c-llm, data: [prompt, rag_context], protocol: https, authenticated: true }

trust_boundaries:
  - { id: tb-edge, name: 公開網路邊界,   zones: [z-public, z-app] }
  - { id: tb-data, name: 資料層邊界,     zones: [z-app, z-data] }

# 致命三要素盤點：三者皆 true 且 mitigations 無法切斷任一隻腳 → G0 不得放行（見 trifecta_leg_cut）
agents:
  - id: c-agent
    accesses_private_data: true          # 讀 c-db 的 pii
    exposed_to_untrusted_content: true   # 經 c-web 擷取外部網頁
    can_communicate_externally: true     # 可發 HTTP、呼叫外部 API
    tools: [search_notes, fetch_url, summarize]
    high_impact_tools: []                # 若含 delete_*/execute_sql 必須列入並要求 HITL
    mitigations: [egress_allowlist, read_only_data]
    trifecta_leg_cut: untrusted_content  # 本例選擇以出向 allow-list + 擷取內容淨化切斷「不受信任內容」腳

# threats 可由 G0 產出模板（docs/templates/g0-report.md）填寫，或先留空由威脅建模工作坊補齊
threats: []

risk_tier: L2
risk_tier_rationale: >
  對外（exposure=public）＋處理個資（data_sensitivity=pii）→ 至少 L2；Agent 具致命三要素，
  已於設計期切斷一隻腳並加出向 allow-list，故不升為 L3；若 Agent 取得寫入／刪除權限則升 L3。

decisions:
  - 允許上傳的檔案類型：僅 .md/.txt，上限 1 MB。
  - 密碼最短長度：15 字元；啟用 MFA（ASVS L2）。
  - Agent 出向 allow-list：僅 api.example.com、docs.example.com。
