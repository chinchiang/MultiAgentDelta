# VibeSec OWASP ZAP 規則設定（G5；api-scan / baseline 共用） / VibeSec OWASP ZAP G5 rules, shared by api-scan and baseline.
# 格式：<rule id>\t<WARN|FAIL|IGNORE|OUTOFSCOPE>\t(說明) / Format: rule ID, tab, WARN/FAIL/IGNORE/OUTOFSCOPE, tab, description.
# 用法： / Usage:
#   docker run --rm -v "$PWD:/zap/wrk:rw" -t ghcr.io/zaproxy/zaproxy:stable \
#     zap-api-scan.py -t "$VIBESEC_TARGET_URL/openapi.json" -f openapi -c config/zap/api-scan.conf -r reports/zap-api.html -J reports/zap-api.json
#   docker run --rm -v "$PWD:/zap/wrk:rw" -t ghcr.io/zaproxy/zaproxy:stable \
#     zap-baseline.py -t "$VIBESEC_TARGET_URL" -c config/zap/api-scan.conf -r reports/zap-baseline.html -J reports/zap-baseline.json
# 注意：shadow 模式下 FAIL 只影響 ZAP 自身 exit code；harness 仍依 blocking-policy 判定。 / In shadow mode FAIL affects ZAP's own exit code; the harness still uses blocking-policy.
# ZAP 不涵蓋 Prompt Injection（交 G6）。rule_id 記為 zap:<id>。 / ZAP does not cover prompt injection; G6 handles it. Use zap:<id> rule IDs.
#
# ---- 主動掃描：注入與伺服端（G5 核心；FAIL） ---- / Active scans: injection and server-side checks, the G5 core; FAIL.
