# VibeSec G1：幻覺套件 / typosquat 黑名單
# status 說明： / Status definitions:
#   confirmed_malicious   — 曾被 Registry 下架或由安全廠商 / 國家級 CERT 證實為惡意（來源見 source）
#   hallucination_prone   — LLM 常輸出但不存在、已被搶註為空殼、或與真實套件混淆的名稱（可能無害，但一律阻擋並要求人工確認） / hallucination_prone: nonexistent, squatted placeholder, or confused names often emitted by LLMs; always block pending human confirmation even if harmless.
#   confusable_legit      — 真實存在但極易與另一套件混淆（例如 sklearn 應為 scikit-learn）；依 action 阻擋或警示並提示正確名稱 / confusable_legit: real but easily confused names, such as sklearn/scikit-learn; block or warn according to action and show the correct name.
# action：block（阻擋）/ warn（advisory，列印正確名稱） / action is block or warn; warn is advisory and prints the correct name.
# 本清單是最後一道備援；主要防線是 cooldown.yaml 的 Registry 健康度與相似度檢查。更新時附來源與日期。 / This list is a fallback; registry health and similarity in cooldown.yaml are primary. Include sources and dates when updating.

