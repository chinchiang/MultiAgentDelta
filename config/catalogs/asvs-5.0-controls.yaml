# VibeSec 控制目錄 — OWASP ASVS 5.0.0（節層級）
#
# ★ 免責說明（必讀）
# 本檔的控制 ID（ASVS5-V<章>.<節>）是 vibesec 依 ASVS 5.0.0 的「章 / 節」結構自行編派的
# 節層級識別碼，用來讓 finding.control_id 可被程式驗證與統計覆蓋率。
# 它們「不是」OWASP 官方的需求編號（官方需求編號為 V<章>.<節>.<需求>，三段式）。
# 對外引用（稽核、客戶報告、合規文件）前，必須回到官方標準逐條核對：
#   https://owasp.org/www-project-application-security-verification-standard/
# 來源標記：
#   source: asvs-5.0.0-mindmap   → 由使用者提供的 ASVS 5.0.0 心智圖（V1–V6）整理
#   source: vibesec-extension    → vibesec 依 ASVS 5.0.0 官方章名補的占位章節（V7–V10、V13、V15、V16），
#                                  topics 為 vibesec 摘要，非逐字引用；僅供閘門對照，引用前同樣要核對。
# level 欄位為「最佳努力」推估（1 = 最低防線、2 = 標準實務、3 = 高保證），非官方等級標註。
# gates 欄位：哪些執行閘門（G1–G6）會驗證本節；G0 為設計期文件化，不列入自動驗證。

version: "5.0.0"
id_scheme: "ASVS5-V<chapter>.<section>"
official_numbering: false
updated: "2026-10-03"

principles:
  # 心智圖「標準範圍與原則」節點；非控制，供 G0 與報告引用語意
  levels:
    L1: "第一層防禦的最低要求（約佔 20%）"
    L2: "標準安全實踐的全方位視角（約佔 50%）— vibesec 預設基線"
    L3: "高級高保證需求與縱深防禦（約佔 30%）— 高價值系統；ASVS 5.0 於此層級明列正式威脅建模"
  verification_semantics: "驗證結果必須為通過或失敗；vibesec 另加 pending / untested / not_applicable / incomplete，且 incomplete 永不等於 pass"
  documented_security_decisions: "規劃安全設計與實作機制；定義輸入驗證與權限規則文件（對應 ASVS5-V15.1 與各章 x.1 文件化節）"

chapters:
  - chapter: V1
    title_zh: 編碼與淨化
    title_en: Encoding and Sanitization
    source: asvs-5.0.0-mindmap
    controls:
      - id: ASVS5-V1.1
        title_zh: 編碼與淨化架構
        level: 1
        topics:
          - "正則化解碼：僅解碼一次並在處理前完成"
          - "輸出編碼：解釋器使用前的最終步驟"
        gates: [G3, G6]
        notes: "XSS 輸出編碼；AI 輸出渲染到 DOM 前同樣適用"
      - id: ASVS5-V1.2
        title_zh: 注入防範
        level: 1
        topics:
          - "HTML 與 XML：根據上下文進行相關編碼"
          - "動態 URL：依內容進行 URL 或 base64url 編碼"
          - "資料庫查詢：使用參數化查詢或 ORM"
          - "OS 指令：使用參數化 OS 查詢或命令列編碼"
          - "CSV 與公式注入：遵循 RFC 4180 轉義規則"
        gates: [G3, G5, G6]
        notes: "AI 字串拼接 SQL / Command 的主要落點"
      - id: ASVS5-V1.3
        title_zh: 淨化機制
        level: 1
        topics:
          - "HTML 淨化：使用安全函式庫處理 WYSIWYG 輸入"
          - "動態執行：避免使用 eval() 或 SpEL"
          - "SSRF 防範：驗證協定、網域與連接埠白名單"
        gates: [G3, G5]
      - id: ASVS5-V1.4
        title_zh: 記憶體與序列化
        level: 2
        topics:
          - "記憶體安全：防止堆疊或緩衝區溢位"
          - "XML 解析：停用外部實體以防 XXE 攻擊"
          - "安全反序列化：使用型別白名單限制物件"
        gates: [G3]

  - chapter: V2
    title_zh: 驗證與商業邏輯
    title_en: Validation and Business Logic
    source: asvs-5.0.0-mindmap
    controls:
      - id: ASVS5-V2.1
        title_zh: 驗證與商業邏輯文件
        level: 1
        topics:
          - "輸入驗證規則：定義預期結構的檢查方式"
          - "商業邏輯限制：記錄全域與使用者級別限制"
        gates: []
        notes: "G0 設計期文件化產出"
      - id: ASVS5-V2.2
        title_zh: 輸入驗證
        level: 1
        topics:
          - "業務期望驗證：使用正面驗證與白名單"
          - "信任服務層：於伺服器端強制執行驗證"
        gates: [G3, G5]
      - id: ASVS5-V2.3
        title_zh: 商業邏輯安全
        level: 2
        topics:
          - "順序流程：按順序處理且不可略過步驟"
          - "多人審批：高價值業務流程需多方授權"
        gates: [G4]
        notes: "Agent 高影響動作的 Human-in-the-Loop 對應此節"
      - id: ASVS5-V2.4
        title_zh: 防自動化
        level: 2
        topics:
          - "反自動化控制：防止過度呼叫與資源耗盡"
        gates: [G5, G6]
        notes: "登入 / 重設密碼 Rate Limiting、Captcha；LLM Denial of Wallet"

  - chapter: V3
    title_zh: 網頁前端安全
    title_en: Web Frontend Security
    source: asvs-5.0.0-mindmap
    controls:
      - id: ASVS5-V3.1
        title_zh: 未預期內容解釋
        level: 1
        topics:
          - "內容渲染控制：防止錯誤上下文呈現"
        gates: [G5]
      - id: ASVS5-V3.2
        title_zh: Cookie 設定
        level: 1
        topics:
          - "Secure 屬性：確保 Cookie 僅透過加密傳輸"
          - "SameSite 屬性：限制跨站請求偽造（CSRF）"
          - "__Host- 前綴：加強 Cookie 安全性"
          - "HttpOnly 屬性：防止前端指令碼存取敏感 Cookie"
        gates: [G5]
      - id: ASVS5-V3.3
        title_zh: 瀏覽器安全標頭
        level: 1
        topics:
          - "CORS 設定：嚴格驗證跨來源資源共用"
          - "Content-Security-Policy（CSP）：限制載入受信任資源"
          - "X-Content-Type-Options：禁止 MIME 類型嗅探"
          - "Referrer-Policy：防止敏感資料洩漏"
        gates: [G3, G5]
        notes: "IaC / 程式層 CORS 萬用字元由 G3 靜態攔截，G5 以實際回應標頭驗證"
      - id: ASVS5-V3.4
        title_zh: 瀏覽器來源隔離
        level: 1
        topics:
          - "請求偽造防範：驗證防偽權杖或自訂標頭"
          - "postMessage 驗證：確保訊息來源可信"
        gates: [G5]

  - chapter: V4
    title_zh: API 與網頁服務
    title_en: API and Web Service
    source: asvs-5.0.0-mindmap
    controls:
      - id: ASVS5-V4.1
        title_zh: 通用網頁服務安全
        level: 1
        topics:
          - "Content-Type 標頭：確保與回應內容相符"
        gates: [G5]
      - id: ASVS5-V4.2
        title_zh: HTTP 訊息結構驗證
        level: 2
        topics:
          - "請求走私防範：正確判定 HTTP 訊息邊界"
        gates: [G5]
      - id: ASVS5-V4.3
        title_zh: GraphQL 與 WebSocket
        level: 2
        topics:
          - "GraphQL 限制：使用深度限制與查詢成本分析防範 DoS"
          - "WebSocket 安全：所有連線強制使用 TLS（WSS）"
        gates: [G5]
        notes: "GraphQL Introspection 外溢亦掛於此節（配合 ASVS5-V13.4）"

  - chapter: V5
    title_zh: 檔案處理
    title_en: File Handling
    source: asvs-5.0.0-mindmap
    controls:
      - id: ASVS5-V5.1
        title_zh: 檔案處理文件
        level: 1
        topics:
          - "上傳規範：定義允許的副檔名與大小限制"
        gates: []
      - id: ASVS5-V5.2
        title_zh: 檔案上傳與儲存
        level: 1
        topics:
          - "解壓縮檢查：檢查未壓縮大小與檔案數量"
          - "路徑安全：使用內部產生資料取代使用者檔名以防路徑走訪"
        gates: [G3, G5]

  - chapter: V6
    title_zh: 身分驗證
    title_en: Authentication
    source: asvs-5.0.0-mindmap
    controls:
      - id: ASVS5-V6.1
        title_zh: 密碼安全
        level: 1
        topics:
          - "密碼長度：最少 8 個字元，強烈建議 15 個字元以上"
          - "密碼變更：需提供目前與新密碼"
          - "密碼黑名單：檢查前 3000 個常見密碼"
          - "密碼外洩檢查：比對已外洩的密碼資料庫"
        gates: [G5]
      - id: ASVS5-V6.2
        title_zh: 通用身分驗證安全
        level: 2
        topics:
          - "多因數驗證（MFA）：L2 以上應用程式強制要求"
          - "硬體驗證：L3 應用程式使用受信執行環境（TEE）"
        gates: [G5]
        notes: "登入 / 重設密碼節流與 Captcha 的黑箱驗證掛於此節與 ASVS5-V2.4"

  # ---------------------------------------------------------------------------
  # 以下為 vibesec-extension：依 ASVS 5.0.0 官方章名補的占位章節。
  # topics 為 vibesec 摘要，不是官方需求文字；引用前請核對官方標準。
  # ---------------------------------------------------------------------------
  - chapter: V7
    title_zh: Session 管理
    title_en: Session Management
    source: vibesec-extension
    controls:
      - id: ASVS5-V7.1
        title_zh: Session 管理（占位）
        level: 1
        topics:
          - "伺服器端 Session 驗證：每個受保護 API 都必須驗證 Session / Token，不可只在前端判斷"
          - "登出與逾時撤銷"
        gates: [G4, G5]
        notes: "前端防禦假象：後端 API 缺 Session 驗證"

  - chapter: V8
    title_zh: 授權
    title_en: Authorization
    source: vibesec-extension
    controls:
      - id: ASVS5-V8.1
        title_zh: 授權文件化（占位）
        level: 1
        topics:
          - "角色 × 資源 × 操作矩陣；租戶隔離規則"
        gates: []
      - id: ASVS5-V8.2
        title_zh: 一般授權 / 物件層級授權（占位）
        level: 1
        topics:
          - "每筆資料存取綁定當前已驗證主體（owner binding；防 BOLA / IDOR）"
          - "資料層強制（Row Level Security），不只依賴應用層"
        gates: [G4, G5]
      - id: ASVS5-V8.3
        title_zh: 操作與欄位層級授權（占位）
        level: 2
        topics:
          - "功能層級授權（BFLA）；管理功能不可僅靠單一 middleware 判斷"
          - "縱深防禦：路由層 + 服務層 + 資料層"
        gates: [G4, G5]
        notes: "CVE-2025-29927（Next.js middleware 繞過）為代表案例"

  - chapter: V9
    title_zh: 自含式權杖
    title_en: Self-contained Tokens
    source: vibesec-extension
    controls:
      - id: ASVS5-V9.1
        title_zh: 自含式權杖（JWT）驗證（占位）
        level: 1
        topics:
          - "拒絕 alg:none；演算法白名單固定於伺服器端"
          - "防 RS256 / HS256 混淆：公鑰不得被當成 HMAC 密鑰"
          - "驗證 exp / aud / iss"
        gates: [G3, G5]

  - chapter: V10
    title_zh: OAuth 與 OIDC
    title_en: OAuth and OIDC
    source: vibesec-extension
    controls:
      - id: ASVS5-V10.1
        title_zh: OAuth / OIDC 受眾綁定（占位）
        level: 2
        topics:
          - "Access Token 必須綁定受眾（audience）；MCP 伺服器套用 RFC 8707 Resource Indicators"
          - "拒絕非為本資源簽發的 Token（防 token passthrough / confused deputy）"
        gates: [G4]

  - chapter: V13
    title_zh: 組態
    title_en: Configuration
    source: vibesec-extension
    controls:
      - id: ASVS5-V13.1
        title_zh: 組態文件化（占位）
        level: 1
        topics:
          - "記錄環境差異（dev / staging / prod）與哪些除錯功能必須在正式環境關閉"
        gates: []
      - id: ASVS5-V13.2
        title_zh: 後端通訊組態（占位）
        level: 2
        topics:
          - "服務對服務通訊的身分與最小權限；雲端中繼資料端點（IMDS）強制 IMDSv2"
          - "出向連線 allow-list"
        gates: [G3, G5]
      - id: ASVS5-V13.3
        title_zh: 祕密管理（占位）
        level: 1
        topics:
          - "祕密不得硬編碼於原始碼、Git 歷史、前端 bundle、容器層"
          - "使用祕密管理服務或環境注入；.env 不入版控；外洩即撤銷與輪替"
        gates: [G2]
        notes: "對應舊版 ASVS V13.3 編號語意；正文可寫「組態／祕密管理章節」"
      - id: ASVS5-V13.4
        title_zh: 非預期資訊洩漏（占位）
        level: 1
        topics:
          - "正式環境關閉 Debug Mode、Stack Trace、Swagger UI / OpenAPI 文件、GraphQL Introspection"
          - "錯誤訊息不洩漏內部實作"
        gates: [G5]

  - chapter: V15
    title_zh: 安全編碼與架構
    title_en: Secure Coding and Architecture
    source: vibesec-extension
    controls:
      - id: ASVS5-V15.1
        title_zh: 安全編碼與架構文件（占位）
        level: 1
        topics:
          - "威脅建模（L3 明列為必要）；文件化安全決策"
          - "資料流圖、信任邊界、Agent 能力盤點"
        gates: []
        notes: "G0 產出；NIST AI RMF Map 功能與 ISO 27001:2022 文件化決策對接點"
      - id: ASVS5-V15.2
        title_zh: 安全架構與相依性（占位）
        level: 1
        topics:
          - "第三方元件清單（SBOM）、已知漏洞比對、來源可信度"
          - "拒絕來源不明 / 幻覺 / 冷卻期未滿的套件；安裝腳本審查"
        gates: [G1]

  - chapter: V16
    title_zh: 安全日誌與錯誤處理
    title_en: Security Logging and Error Handling
    source: vibesec-extension
    controls:
      - id: ASVS5-V16.1
        title_zh: 安全事件日誌（占位）
        level: 2
        topics:
          - "Agent 工具呼叫、LLM 請求量與成本必須可稽核"
          - "用量限制 / 熔斷事件記錄"
        gates: [G4, G6]
        notes: "MAESTRO-L5 Evaluation & Observability 對接點"

# -----------------------------------------------------------------------------
# vibesec 自有控制（VS-G<N>-<NAME>）：ASVS 未直接涵蓋、但本框架要求的控制。
# 格式符合 schemas/finding.schema.json 的 control_id pattern。
# -----------------------------------------------------------------------------
vibesec_controls:
  - id: VS-G0-LETHAL-TRIFECTA
    title_zh: 致命三要素必須在設計期切斷至少一隻腳
    gates: [G4, G6]
    source: "Simon Willison, The Lethal Trifecta for AI agents"
  - id: VS-G0-RISK-TIER
    title_zh: 風險分級 L1/L2/L3 已決定並寫入 vibesec.yaml
    gates: []
  - id: VS-G1-SLOPSQUAT
    title_zh: 幻覺套件 / 名稱相似度 / 黑名單比對
    gates: [G1]
  - id: VS-G1-COOLDOWN
    title_zh: 新套件版本冷卻期（cooldown_days）
    gates: [G1]
  - id: VS-G1-INSTALL-HOOK
    title_zh: postinstall / setup.py 安裝鉤子行為審查
    gates: [G1]
  - id: VS-G1-SBOM
    title_zh: CycloneDX SBOM 產出與 EPSS / KEV 加值
    gates: [G1]
  - id: VS-G4-AGENT-TOOL-ALLOWLIST
    title_zh: Agent 工具 allow-list；高影響工具不暴露給通用 Agent
    gates: [G4, G6]
  - id: VS-G4-RULES-FILE-UNICODE
    title_zh: Agent 規則檔不得含隱形 Unicode（Rules File Backdoor）
    gates: [G1, G4]
  - id: VS-G4-MCP-RESOURCE-INDICATOR
    title_zh: MCP 伺服器 OAuth 使用 RFC 8707 Resource Indicators
    gates: [G4]
  - id: VS-G6-DENIAL-OF-WALLET
    title_zh: LLM 用量限制：速率限制、Token 配額、熔斷
    gates: [G6]
