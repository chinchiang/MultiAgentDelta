# -----------------------------------------------------------------------------
# vibesec 自有控制（VS-G<N>-<NAME>）：ASVS 未直接涵蓋、但本框架要求的控制。 / VibeSec-owned VS-G<N>-<NAME> controls cover framework requirements not directly addressed by ASVS.
# 格式符合 schemas/finding.schema.json 的 control_id pattern。 / IDs match the control_id pattern in schemas/finding.schema.json.
# -----------------------------------------------------------------------------
vibesec_controls:
  - id: VS-G0-LETHAL-TRIFECTA
    title_zh: 致命三要素必須在設計期切斷至少一隻腳
    title_en: "Cut at least one lethal-trifecta leg at design time"
    gates: [G4, G6]
    source: "Simon Willison, The Lethal Trifecta for AI agents"
  - id: VS-G0-RISK-TIER
    title_zh: 風險分級 L1/L2/L3 已決定並寫入 vibesec.yaml
    title_en: "Determine L1/L2/L3 and synchronize vibesec.yaml"
    gates: []
  - id: VS-G1-SLOPSQUAT
    title_zh: 幻覺套件 / 名稱相似度 / 黑名單比對
    title_en: "Hallucinated-package, similarity, and blacklist checks"
    gates: [G1]
  - id: VS-G1-COOLDOWN
    title_zh: 新套件版本冷卻期（cooldown_days）
    title_en: "New-version cooldown period"
    gates: [G1]
  - id: VS-G1-INSTALL-HOOK
    title_zh: postinstall / setup.py 安裝鉤子行為審查
    title_en: "Review postinstall/setup.py behavior"
    gates: [G1]
  - id: VS-G1-SBOM
    title_zh: CycloneDX SBOM 產出與 EPSS / KEV 加值
    title_en: "Generate CycloneDX SBOM and enrich with EPSS/KEV"
    gates: [G1]
  - id: VS-G4-AGENT-TOOL-ALLOWLIST
    title_zh: Agent 工具 allow-list；高影響工具不暴露給通用 Agent
    title_en: "Agent tool allowlist; no broad high-impact tools on general agents"
    gates: [G4, G6]
  - id: VS-G4-RULES-FILE-UNICODE
    title_zh: Agent 規則檔不得含隱形 Unicode（Rules File Backdoor）
    title_en: "No invisible Unicode in agent rule files"
    gates: [G1, G4]
  - id: VS-G4-LLM-REVIEW
    title_zh: 授權類發現經多模型審查（≥ 2 family）；分歧交人工裁決（docs/09）
    title_en: "Authorization review by at least two families; humans resolve disagreements"
    gates: [G4]
  - id: VS-G4-MCP-RESOURCE-INDICATOR
    title_zh: MCP 伺服器 OAuth 使用 RFC 8707 Resource Indicators
    title_en: "MCP OAuth uses RFC 8707 resource indicators"
    gates: [G4]
  - id: VS-G6-DENIAL-OF-WALLET
    title_zh: LLM 用量限制：速率限制、Token 配額、熔斷
    title_en: "LLM resource limits: rate limits, token quotas, circuit breakers"
    gates: [G6]
