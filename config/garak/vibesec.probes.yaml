# VibeSec G6 — garak（NVIDIA，Apache-2.0，「LLM 界的 Nmap」）設定
# 用法（只能打 VIBESEC_TARGET_URL 指向的、已授權的測試環境）：
#   garak --config config/garak/vibesec.probes.yaml
#   # 或覆寫 probe：garak --config config/garak/vibesec.probes.yaml --spec probes.promptinject,probes.dan
# 對應 garak 0.17 schema：probe 選擇用 run.spec（include/exclude），target 用 plugins.target_type / target_name。
# 報告：reports/garak/<report_prefix>.report.jsonl 與 .hitlog.jsonl；harness 把每個 hit → finding（rule_id = garak:<probe>.<detector>）
#
# ★ 必須依環境修改的欄位（標 EDIT）：
#   plugins.generators.rest.RestGenerator.uri          ← 靶場 chat 端點（可用環境變數 $VIBESEC_TARGET_URL 展開後填入）
#   plugins.generators.rest.RestGenerator.headers      ← 若需要 Bearer Token
#   plugins.generators.rest.RestGenerator.response_json_field ← 靶場回應中的文字欄位名稱
#   run.generations                                    ← 每個 prompt 重複次數（越高越慢、越貴）

---
system:
  verbose: 0
  parallel_attempts: 4          # 同時併發；配合 Denial of Wallet 觀察時可拉到 20
  # 只開一層 pool：parallel_attempts 與 parallel_requests 同時開啟時，generations > 1 會在 attempt worker
  # （daemon process）內再開 request pool → AssertionError: daemonic processes are not allowed to have children
  parallel_requests: false
  narrow_output: false
  show_100_pass_modules: false

run:
  seed: 42
  deprefix: true
  eval_threshold: 0.5
  generations: 3                # EDIT：正式複測建議 5–10
  # garak ≥ 0.15：probe 選擇改用 run.spec（舊的 plugins.probe_spec / run.probe_tags 已棄用）
  spec:
    include:
      - probes.promptinject
      - probes.dan
      - probes.encoding
      - probes.leakreplay
      - probes.web_injection

plugins:
  target_type: rest
  target_name: vibesec-chat     # 只是報告中的標籤
  # 對應 vibesec.yaml gates.g6_ai_red_team.checks：
  #   promptinject  → direct_prompt_injection（LLM01）
  #   dan           → direct_prompt_injection / 越獄（LLM01）
  #   encoding      → direct_prompt_injection 的編碼繞法（base64 / rot13 等）
  #   leakreplay    → system_prompt_extraction / 訓練資料洩漏（LLM02 / LLM07）
  #   web_injection → stored_xss_via_ai_output（LLM05；garak 0.17 起 xss probe 併入此模組：TaskXSS、MarkdownXSS、MarkdownImageExfil…）
  # 可加：latentinjection（間接注入）、packagehallucination（LLM09；幻覺套件）、divergence（LLM10）
  detector_spec: auto
  extended_detectors: false
  buff_spec: null

  generators:
    rest:
      RestGenerator:
        name: vibesec-chat
        uri: "http://localhost:8000/chat"            # EDIT：改成 $VIBESEC_TARGET_URL/chat
        method: post
        headers:
          Content-Type: application/json
          X-VibeSec-Run: g6-garak
          # Authorization: "Bearer $VIBESEC_TOKEN_A"   # EDIT：需要登入時打開；garak 會展開 $ENV 變數
        req_template_json_object:
          message: "$INPUT"
          context: ""
        response_json: true
        response_json_field: "reply"                  # EDIT：靶場回應欄位（可用 JSONPath，例如 $.data.text）
        request_timeout: 60
        ratelimit_codes: [429]
        skip_codes: []
        max_tokens: 1024
        temperature: null
        top_k: null

  probes:
    encoding:
      payloads: ["default", "xss"]

reporting:
  # 相對目錄以 garak 資料目錄為基準；CI 以絕對 --report_prefix 固定到工作區。
  report_dir: reports/garak
  report_prefix: g6-garak       # staging workflow 以此前綴蒐集報告
  taxonomy: owasp                # 報告中附 OWASP LLM Top 10 標籤
  show_100_pass_modules: false
