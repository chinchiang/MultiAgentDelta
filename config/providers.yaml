# config/providers.yaml — 多模型審查的 provider 設定 / config/providers.yaml: multi-model review provider configuration.
# 由 harness agent（docs/08、docs/09）讀取。每個 provider 透過統一介面 / Read by the harness agent described in docs/08 and docs/09, through a unified interface.
#   complete(messages, json_schema, temperature) 呼叫；harness 不直接依賴任一家 SDK。 / Call complete(messages, json_schema, temperature); the harness does not depend directly on one vendor's SDK.
# 規則： / Rules:
#   - 金鑰只從環境變數讀（api_key_env），本檔不得出現明文金鑰。 / Read keys only from api_key_env environment variables; never put plaintext keys here.
#   - allowed_data_classes 決定哪些內容可以送給該 provider（CLAUDE.md 第 7 條「不得外傳」）。 / allowed_data_classes determines permissible content under CLAUDE.md rule 7.
#   - family 相同的 provider 只算「一個模型家族」；高風險控制需 ≥ 2 個不同 family。 / Providers sharing a family count once; high-risk controls require at least two families.
#   - 模型名稱為啟動前需盤點的佔位值；標 "確認可用版本" 者請以供應商當日文件為準。 / Model names require preflight verification against current vendor documentation.

version: 1

# 資料分級定義（與 schemas/threat-model.schema.json 的 assets[].sensitivity 對齊） / Data classes align with assets[].sensitivity in schemas/threat-model.schema.json.
#   public        公開資訊、開源程式碼 / public: public information and open-source code.
#   internal      一般內部程式碼與設定（不含祕密、不含個資） / internal: ordinary internal code and configuration without secrets or personal data.
#   confidential  商業機密、含遮罩祕密的片段、客戶資料結構 / confidential: trade secrets, snippets containing masked secrets, and customer data structures.
#   pii           個人資料樣本或可識別個人之內容 / pii: personal-data samples or identifiable personal content.
data_classes: [public, internal, confidential, pii]

providers:

  # ---------------------------------------------------------------- anthropic
  anthropic-cloud:
    family: anthropic                 # 模型家族，用於計算 min_families / Model family used to calculate min_families.
    kind: anthropic                   # 使用 Anthropic Messages API 介面 / Uses the Anthropic Messages API.
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY    # 從此環境變數讀金鑰 / Read the key from this environment variable.
    model: claude-sonnet-5-5          # 預設模型；確認可用版本 / Default model; confirm an available version.
    timeout_seconds: 120              # 單次呼叫逾時；逾時 → opinion 缺席（docs/09 §11） / Per-call timeout; a timeout means the opinion is absent, per docs/09 §11.
    max_tokens: 4096                  # 回應上限；角色輸出為結構化 JSON，4k 足夠 / Response limit; structured role JSON normally fits within 4k.
    temperature: 0                    # 固定 0，使同一 prompt_version 的輸出可比較 / Fix at zero to compare outputs for the same prompt_version.
    json_mode: true                   # 要求結構化輸出；不支援時 harness 以 schema 事後驗證 / Request structured output; otherwise validate against the schema afterward.
    allowed_data_classes: [public, internal]   # 雲端：不得送 confidential / pii / Cloud: do not send confidential or pii data.
    enabled: true

  # 使用者提供 AWS 憑證供 G4 審查；與既有 Anthropic 相同分級，不允許 confidential／pii。
  # User-supplied AWS credentials for G4; same classes as Anthropic, excluding confidential/pii.
  anthropic-bedrock:
    family: anthropic
    kind: bedrock
    aws_region: us-east-1
    api_key_env: AWS_ACCESS_KEY_ID
    model: us.anthropic.claude-sonnet-4-20250514-v1:0
    timeout_seconds: 180
    max_tokens: 12000
    temperature: 0
    json_mode: true
    allowed_data_classes: [public, internal]
    enabled: true

  # ------------------------------------------------------------------- openai
  openai-cloud:
    family: openai
    kind: openai_compatible           # Chat Completions 相容端點 / Chat Completions-compatible endpoint.
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: gpt-5                      # 確認可用版本 / Confirm an available version.
    timeout_seconds: 120
    max_tokens: 4096
    temperature: 0
    json_mode: true                   # response_format: json_schema / json_object
    allowed_data_classes: [public, internal]
    enabled: true

  # ------------------------------------------------------------------- google
  gemini-cloud:
    family: google
    kind: openai_compatible           # Gemini API 的 OpenAI 相容端點（Chat Completions） / Gemini API's OpenAI-compatible Chat Completions endpoint.
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    model: gemini-3.8-flash           # 2026-10-07 以 models.list 確認可用 / Availability confirmed with models.list on 2026-10-07.
    timeout_seconds: 180
    max_tokens: 16384                 # 思考 token 也計入上限；審查意見 JSON 常有數千字 / Thinking tokens also count toward the limit; review JSON can contain thousands of characters.
    temperature: 0
    json_mode: true
    # 人工決定（2026-10-07 @chinchiang）：作為 G4 高風險審查的第二個 family，允許接收 internal（例如受測專案的原始碼）。 / Human decision by @chinchiang on 2026-10-07: use as the second family for G4 high-risk review and allow internal data such as reviewed source code.
    # confidential／pii 仍只走 sensitive_data_providers（onprem_vllm）。祕密在送出前仍須遮罩（CLAUDE.md 規則 7）。 / confidential and pii data remain limited to sensitive_data_providers, onprem_vllm; mask secrets before sending under CLAUDE.md rule 7.
    allowed_data_classes: [public, internal]
    enabled: true

  # ---------------------------------------------------------------------- glm
  glm-cloud:
    family: glm
    kind: openai_compatible
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: GLM_API_KEY
    model: glm-4.5                    # 確認可用版本 / Confirm an available version.
    timeout_seconds: 120
    max_tokens: 4096
    temperature: 0
    json_mode: true
    allowed_data_classes: [public]    # 境外雲端且資料出境限制：只送公開資訊（例如開源套件公告比對） / Cross-border cloud restrictions: send only public information, such as open-source package advisories.
    enabled: true

  # ----------------------------------------------------------------- deepseek
  deepseek-cloud:
    family: deepseek
    kind: openai_compatible
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-chat              # 確認可用版本 / Confirm an available version.
    timeout_seconds: 120
    max_tokens: 4096
    temperature: 0
    json_mode: true
    allowed_data_classes: [public]
    enabled: true

  # ------------------------------------------------------------- 地端 vLLM 範例 / On-premises vLLM example.
  # 地端 OpenAI 相容端點（vLLM / TGI / Ollama 皆可）。family 依實際部署的模型填寫： / On-premises OpenAI-compatible endpoint, such as vLLM/TGI/Ollama; set family to the deployed model.
  # 若跑的是 DeepSeek 開源權重就填 deepseek，跑 GLM 開源權重就填 glm； / Use deepseek for DeepSeek open weights and glm for GLM open weights.
  # 地端與雲端同 family 不算兩個家族。此處以 deepseek 為例。 / The same family on premises and in the cloud still counts once; this example uses deepseek.
  onprem_vllm:
    family: deepseek
    kind: openai_compatible
    base_url: http://vllm.internal:8000/v1
    api_key_env: ONPREM_VLLM_API_KEY  # 內網仍建議設 token；無則設為任意非空值 / Use a token even internally; if unsupported, set any nonempty value.
    model: deepseek-r1-distill-qwen-32b   # 佔位；以實際載入的權重為準 / Placeholder; match the weights actually loaded.
    timeout_seconds: 300              # 地端推論較慢，給較長預算 / Allow a longer budget for slower on-premises inference.
    max_tokens: 4096
    temperature: 0
    json_mode: true                   # vLLM 支援 guided_json；不支援時關閉並靠事後驗證 / vLLM supports guided_json; disable when unsupported and validate afterward.
    allowed_data_classes: [public, internal, confidential, pii]   # 未分類與敏感資料只能留地端 / Unclassified and sensitive data must remain on premises.
    enabled: false                    # 有地端環境時改 true / Set true when an on-premises environment exists.

# ------------------------------------------------------------------- rotation
# 角色 → 偏好 family 順序。harness 依序挑「enabled、金鑰存在、allowed_data_classes 符合」者， / Role-to-family preference order; select providers that are enabled, have keys, and allow the data class.
# 第一個為主意見、第二個不同 family 為第二意見（高風險控制必需）。 / The first supplies the primary opinion; a second distinct family supplies the required high-risk second opinion.
rotation:
  high_risk_min_families: 2           # 與 vibesec.yaml review.min_families_for_high_risk 一致 / Matches review.min_families_for_high_risk in vibesec.yaml.
  roles:
    architecture:      [anthropic, openai, google, deepseek, glm]
    appsec:            [anthropic, openai, google, deepseek, glm]
    identity-authz:    [openai, anthropic, google, deepseek, glm]
    supplychain-cicd:  [openai, google, deepseek, anthropic, glm]
  # 當偏好 family 全部不可用時的遞補順序（provider 名稱，非 family） / Fallback order when preferred families are unavailable; these are provider names, not families.
  fallback_order: [anthropic-cloud, openai-cloud, gemini-cloud, onprem_vllm, deepseek-cloud, glm-cloud]
  # 資料分級為 confidential / pii 時，只允許這些 provider（覆寫上面的偏好） / For confidential/pii, only these providers are allowed, overriding preferences.
  sensitive_data_providers: [onprem_vllm]
  # 審查預算（每次 harness 執行）；超過 → 剩餘高風險發現 pending、閘門 incomplete（docs/09 §6） / Per-run review budget; exhaustion leaves high-risk findings pending and the gate incomplete, per docs/09 §6.
  budget:
    max_calls_per_run: 400
    max_calls_per_finding: 24         # 4 角色 × 2 family × 3 輪 / Four roles × two families × three rounds.
