# config/providers.yaml — 多模型審查的 provider 設定
# 由 harness agent（docs/08、docs/09）讀取。每個 provider 透過統一介面
#   complete(messages, json_schema, temperature) 呼叫；harness 不直接依賴任一家 SDK。
# 規則：
#   - 金鑰只從環境變數讀（api_key_env），本檔不得出現明文金鑰。
#   - allowed_data_classes 決定哪些內容可以送給該 provider（CLAUDE.md 第 7 條「不得外傳」）。
#   - family 相同的 provider 只算「一個模型家族」；高風險控制需 ≥ 2 個不同 family。
#   - 模型名稱為啟動前需盤點的佔位值；標 "確認可用版本" 者請以供應商當日文件為準。

version: 1

# 資料分級定義（與 schemas/threat-model.schema.json 的 assets[].sensitivity 對齊）
#   public        公開資訊、開源程式碼
#   internal      一般內部程式碼與設定（不含祕密、不含個資）
#   confidential  商業機密、含遮罩祕密的片段、客戶資料結構
#   pii           個人資料樣本或可識別個人之內容
data_classes: [public, internal, confidential, pii]

providers:

  # ---------------------------------------------------------------- anthropic
  anthropic-cloud:
    family: anthropic                 # 模型家族，用於計算 min_families
    kind: anthropic                   # 使用 Anthropic Messages API 介面
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY    # 從此環境變數讀金鑰
    model: claude-sonnet-5-5          # 預設模型；確認可用版本
    timeout_seconds: 120              # 單次呼叫逾時；逾時 → opinion 缺席（docs/09 §11）
    max_tokens: 4096                  # 回應上限；角色輸出為結構化 JSON，4k 足夠
    temperature: 0                    # 固定 0，使同一 prompt_version 的輸出可比較
    json_mode: true                   # 要求結構化輸出；不支援時 harness 以 schema 事後驗證
    allowed_data_classes: [public, internal]   # 雲端：不得送 confidential / pii
    enabled: true

  # AWS Bedrock 上的 Anthropic 模型（同 family：anthropic）。呼叫用明確的 IAM 憑證，不使用隱含帳號。
  # 人工決定（2026-10-10，repo 擁有者）：啟用，允許 public／internal 送到 AWS（CLAUDE.md 規則 7）；confidential／pii 仍只走地端。
  # 需要 boto3。憑證二擇一：AWS_ACCESS_KEY_ID＋AWS_SECRET_ACCESS_KEY（必要時 AWS_SESSION_TOKEN），
  # 或 AWS_PROFILE 指名的 profile（AWS SSO：先 `aws sso login --profile <名稱>`；token 過期 → state: error）。
  anthropic-bedrock:
    family: anthropic
    kind: bedrock                     # boto3 bedrock-runtime Converse API；兩種憑證皆缺 → state: missing
    api_key_env: AWS_ACCESS_KEY_ID    # access key id；secret／session token 另由 AWS_SECRET_ACCESS_KEY／AWS_SESSION_TOKEN 讀取並遮罩
    aws_profile_env: AWS_PROFILE      # 無明確金鑰時才用；只用這個指名的 profile，不落到預設憑證鏈
    aws_region: ap-southeast-1
    model: global.anthropic.claude-haiku-5-5    # 測試階段先用 Haiku（2026-10-10）；正式審查改 global.anthropic.claude-sonnet-5-5 或 opus-5-5
    timeout_seconds: 180
    max_tokens: 12000
    temperature: null                 # 此模型不接受 temperature（ValidationException）；不送 → 同一 prompt 的輸出可比較性下降
    json_mode: true
    allowed_data_classes: [public, internal]
    enabled: true

  # ------------------------------------------------------------------- openai
  openai-cloud:
    family: openai
    kind: openai_compatible           # Chat Completions 相容端點
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: gpt-5                      # 確認可用版本
    timeout_seconds: 120
    max_tokens: 4096
    temperature: 0
    json_mode: true                   # response_format: json_schema / json_object
    allowed_data_classes: [public, internal]
    enabled: true

  # ------------------------------------------------------------------- google
  gemini-cloud:
    family: google
    kind: openai_compatible           # Gemini API 的 OpenAI 相容端點（Chat Completions）
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    model: gemini-3.8-flash           # 2026-10-07 以 models.list 確認可用
    timeout_seconds: 180
    max_tokens: 16384                 # 思考 token 也計入上限；審查意見 JSON 常有數千字
    temperature: 0
    json_mode: true
    # 人工決定（2026-10-07 @chinchiang）：作為 G4 高風險審查的第二個 family，允許接收 internal（例如受測專案的原始碼）。
    # confidential／pii 仍只走 sensitive_data_providers（onprem_vllm）。祕密在送出前仍須遮罩（CLAUDE.md 規則 7）。
    allowed_data_classes: [public, internal]
    enabled: true

  # ---------------------------------------------------------------------- glm
  glm-cloud:
    family: glm
    kind: openai_compatible
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: GLM_API_KEY
    model: glm-4.5                    # 確認可用版本
    timeout_seconds: 120
    max_tokens: 4096
    temperature: 0
    json_mode: true
    allowed_data_classes: [public]    # 境外雲端且資料出境限制：只送公開資訊（例如開源套件公告比對）
    enabled: true

  # ----------------------------------------------------------------- deepseek
  deepseek-cloud:
    family: deepseek
    kind: openai_compatible
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-chat              # 確認可用版本
    timeout_seconds: 120
    max_tokens: 4096
    temperature: 0
    json_mode: true
    allowed_data_classes: [public]
    enabled: true

  # ------------------------------------------------------------- 地端 vLLM 範例
  # 地端 OpenAI 相容端點（vLLM / TGI / Ollama 皆可）。family 依實際部署的模型填寫：
  # 若跑的是 DeepSeek 開源權重就填 deepseek，跑 GLM 開源權重就填 glm；
  # 地端與雲端同 family 不算兩個家族。此處以 deepseek 為例。
  onprem_vllm:
    family: deepseek
    kind: openai_compatible
    base_url: http://vllm.internal:8000/v1
    api_key_env: ONPREM_VLLM_API_KEY  # 內網仍建議設 token；無則設為任意非空值
    model: deepseek-r1-distill-qwen-32b   # 佔位；以實際載入的權重為準
    timeout_seconds: 300              # 地端推論較慢，給較長預算
    max_tokens: 4096
    temperature: 0
    json_mode: true                   # vLLM 支援 guided_json；不支援時關閉並靠事後驗證
    allowed_data_classes: [public, internal, confidential, pii]   # 未分類與敏感資料只能留地端
    enabled: false                    # 有地端環境時改 true

  # ------------------------------------------------- 公司內網 LLM（llm.iec.inventec）
  # 人工決定（2026-10-10，repo 擁有者）：視同地端，允許四種分級（CLAUDE.md 規則 7）。
  # 只在公司內網／VPN 解析得到；連不到 → state: error，審查記 incomplete，不改送雲端。
  # GLM 與 DeepSeek 是兩個不同 family：兩者都可用時，高風險審查的 2 family 可完全在內網達成。
  iec-glm:
    family: glm
    kind: openai_compatible
    base_url: https://llm.iec.inventec/v1   # 程式自動補 /chat/completions
    api_key_env: GLM_LOCAL_KEY
    model: GLM-5.3-Flash-FP8
    timeout_seconds: 300
    max_tokens: 8192
    temperature: 0
    json_mode: true                   # 端點不支援 response_format 時改 false，靠事後契約驗證
    allowed_data_classes: [public, internal, confidential, pii]
    enabled: true

  iec-deepseek:
    family: deepseek
    kind: openai_compatible
    base_url: https://llm.iec.inventec/v1
    api_key_env: DEEPSEEK_LOCAL_KEY
    model: DeepSeek-V4-Flash
    timeout_seconds: 300
    max_tokens: 8192
    temperature: 0
    json_mode: true
    allowed_data_classes: [public, internal, confidential, pii]
    enabled: true

  # --------------------------------------------------------- 本機 LM Studio
  # 只聽 127.0.0.1，資料不離開本機 → 四種分級皆可。family 依載入的權重填（nemotron = nvidia）；
  # 換成 qwen／gemma（google）／gpt-oss（openai）時要一併改 family，同 family 不算兩個家族。
  lmstudio-local:
    family: nvidia
    kind: openai_compatible
    base_url: http://127.0.0.1:5422/v1
    api_key_env: LMSTUDIO_API_TOKEN
    model: nvidia/nemotron-3-super    # 2026-10-10 LM Studio 已載入的模型
    timeout_seconds: 600              # 本機推論且含思考 token
    max_tokens: 16384
    temperature: 0
    json_mode: false                  # LM Studio 只收 response_format json_schema／text，json_object 會 HTTP 400
    allowed_data_classes: [public, internal, confidential, pii]
    enabled: true

# ------------------------------------------------------------------- rotation
# 角色 → 偏好 family 順序。harness 依序挑「enabled、金鑰存在、allowed_data_classes 符合」者，
# 第一個為主意見、第二個不同 family 為第二意見（高風險控制必需）。
rotation:
  high_risk_min_families: 2           # 與 vibesec.yaml review.min_families_for_high_risk 一致
  roles:
    architecture:      [anthropic, openai, google, deepseek, glm, nvidia]
    appsec:            [anthropic, openai, google, deepseek, glm, nvidia]
    identity-authz:    [openai, anthropic, google, deepseek, glm, nvidia]
    supplychain-cicd:  [openai, google, deepseek, anthropic, glm, nvidia]
  # 當偏好 family 全部不可用時的遞補順序（provider 名稱，非 family）
  fallback_order: [anthropic-cloud, anthropic-bedrock, openai-cloud, gemini-cloud, iec-deepseek, iec-glm, lmstudio-local, onprem_vllm, deepseek-cloud, glm-cloud]
  # 資料分級為 confidential / pii 時，只允許這些 provider（覆寫上面的偏好）
  sensitive_data_providers: [iec-deepseek, iec-glm, lmstudio-local, onprem_vllm]
  # 審查預算（每次 harness 執行）；超過 → 剩餘高風險發現 pending、閘門 incomplete（docs/09 §6）
  budget:
    max_calls_per_run: 400
    max_calls_per_finding: 24         # 4 角色 × 2 family × 3 輪
