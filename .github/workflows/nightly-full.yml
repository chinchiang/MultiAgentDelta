# VibeSec 夜間全量掃描 — 補齊 diff-aware 未覆蓋的全庫檢查
# 02:00 Asia/Taipei（= 18:00 UTC）。全量 Semgrep + 全量 G1（Syft/Grype/Trivy）+ EPSS/KEV 富化
# + G2 全 Git 歷史祕密掃描（gitleaks git）。
# CodeQL 不在這裡跑：repo 已改用 GitHub Code scanning default setup（PR、push 到 main、每週排程），
# 這裡若再以 advanced 設定上傳 CodeQL 會與 default setup 衝突、上傳失敗（nightly 因此長期紅燈）。
name: VibeSec Nightly Full Scan

on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC = 02:00 Asia/Taipei
  workflow_dispatch:

# workflow 層級只給唯讀；寫入權限按 job 宣告（上傳 SARIF 的 job 才有 security-events: write），
# 不讓 evals 這類不上傳 SARIF、卻會執行 semgrep／checkov 與評測 fixture 的 job 繼承寫入權。
permissions:
  contents: read

jobs:
  semgrep-full:
    name: Semgrep 全量（無 baseline）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload-sarif
      actions: read            # upload-sarif 查詢 workflow run
    container:
      # 釘選版本（與 evals 的 semgrep==1.179.0 一致）。tag 仍可被發布者移動；查不到 digest 時先釘 tag，之後再補 @sha256
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 不設 continue-on-error、不吞退出碼：未加 --error 時 semgrep 有命中也回 0，非 0 = 工具錯誤（規則載入失敗、
      # registry 下載失敗、當掉）。此時刪掉不完整的 SARIF，job 變紅並由 notify 開 issue（incomplete ≠ pass，CLAUDE.md #2）。
      - name: Semgrep scan（全庫、無 diff baseline）
        run: |
          mkdir -p reports
          set +e
          # --disable-nosem 與 PR 閘門一致；--max-target-bytes=0：不靜默跳過 >1 MB 的檔案
          semgrep scan --disable-nosem --max-target-bytes=0 \
            --config config/semgrep/vibesec-rules.yaml \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --sarif --output reports/semgrep-full.sarif
          code=$?
          set -e
          echo "semgrep exit=$code"
          if [ "$code" != "0" ]; then
            rm -f reports/semgrep-full.sarif
            echo "::error::semgrep 執行失敗（exit $code）→ 全量 SAST incomplete"
            exit 1
          fi
          # 退出碼 0 也要確認 SARIF 真的產出且可解析、有 runs，否則同樣是 incomplete；
          # 壞掉的檔案改名保留成 artifact 供查，不上傳 Code scanning
          python3 -I -c '
          import json, os, sys
          p = "reports/semgrep-full.sarif"
          def bad(msg):
              if os.path.exists(p):
                  os.replace(p, "reports/semgrep-full.invalid.sarif")
              sys.exit(f"::error::{msg} → 全量 SAST incomplete")
          try:
              runs = json.load(open(p, encoding="utf-8")).get("runs")
          except Exception as e:
              bad(f"semgrep SARIF 無法解析（{e}）")
          if not isinstance(runs, list) or not runs:
              bad("semgrep SARIF 沒有 runs")
          n = sum(len(r.get("results") or []) for r in runs)
          print(f"semgrep SARIF：{n} 筆結果")
          '
      # 上傳失敗（例如 repo 尚未開啟 Code scanning，見 #68）不影響判定；SARIF 由下一步保存成 artifact。
      - name: Upload Semgrep full SARIF
        if: always() && hashFiles('reports/semgrep-full.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/semgrep-full.sarif
          category: vibesec-nightly-semgrep
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesec-nightly-semgrep
          path: reports/
          if-no-files-found: ignore

  g1-full:
    name: G1 全量供應鏈（Syft/Grype/Trivy + EPSS/KEV 富化）
    runs-on: ubuntu-latest
    # job 層級權限會整組取代 workflow 層級。簽發 SBOM 來源證明的 id-token／attestations 不放在這裡：
    # 這個 job 跑第三方 action（syft／grype／trivy），不能讓它們拿到簽章身分；簽發與驗證在 g1-attest job。
    permissions:
      contents: read
      security-events: write
      actions: read
    # SBOM 產生後、還沒跑任何其他第三方工具（grype、trivy-action）前記下的雜湊；g1-attest 簽章前核對，
    # 避免簽到被後續步驟改寫過的 SBOM（第二輪審查 M6）
    outputs:
      sbom_sha256: ${{ steps.sbom.outputs.sbom_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore 富化快取（EPSS/KEV）
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: vibesec-enrich-${{ github.run_id }}
          restore-keys: |
            vibesec-enrich-

      - name: 安裝 Syft（官方 action，釘選 SHA）
        id: syft
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: 安裝 Grype（官方 action，釘選 SHA）
        id: grype
        continue-on-error: true
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      - name: 將 Syft / Grype 加入 PATH
        continue-on-error: true
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
        run: |
          [ -n "$SYFT_CMD" ] && dirname "$SYFT_CMD" >> "$GITHUB_PATH"
          [ -n "$GRYPE_CMD" ] && dirname "$GRYPE_CMD" >> "$GITHUB_PATH"
          true

      - name: Syft SBOM（全庫）+ Grype（SARIF + JSON）
        id: sbom
        continue-on-error: true
        # 與 PR 的 scripts/g1_sbom.py 相同：npm devDependencies 也列入（建置工具屬供應鏈範圍）
        env:
          SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "true"
        run: |
          mkdir -p reports
          if command -v syft >/dev/null 2>&1; then
            syft dir:. -o cyclonedx-json=reports/sbom.cdx.json
          fi
          # 立刻記下雜湊（在 grype 與其他第三方 action 執行之前）
          if [ -f reports/sbom.cdx.json ]; then
            echo "sbom_sha256=$(sha256sum reports/sbom.cdx.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi
          if command -v grype >/dev/null 2>&1 && [ -f reports/sbom.cdx.json ]; then
            grype sbom:reports/sbom.cdx.json -o sarif --file reports/grype-full.sarif || true
            grype sbom:reports/sbom.cdx.json -o json --file reports/grype-full.json || true
          fi

      - name: Trivy 全庫掃描（SARIF）
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0（v0.0.1–v0.34.2 受 CVE-2026-33634 影響）
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: reports/trivy-full.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW

      # KEV feed：官網 → cisagov/kev-data 鏡像 → 快取（.cache/kev.json），來源與 dateReleased 記在 reports/kev-source.json。
      # 三者皆不可用 → 不寫出 feed，下方富化的 kev 記 null、g1_kev.py 記 incomplete（incomplete ≠ pass）。
      - name: 取得 CISA KEV feed（scripts/fetch_kev.py）
        continue-on-error: true
        run: |
          mkdir -p reports .cache
          python3 scripts/fetch_kev.py --out .cache/kev.json --meta reports/kev-source.json

      - name: EPSS / KEV 富化（inline python, stdlib；分欄記錄、不混算）
        continue-on-error: true
        run: |
          python3 -I - <<'EOF'
          # 由 Grype/Trivy 輸出收集 CVE，查 FIRST EPSS 與 CISA KEV。
          # 不可違反：EPSS 與查詢日、KEV 與日期分欄記錄；不做 CVSS × EPSS × 信心 乘法。
          import json, re, pathlib, datetime, urllib.request, urllib.error, os
          NOW = datetime.datetime.now(datetime.timezone.utc)
          def iso(dt): return dt.replace(microsecond=0).isoformat()
          REPORTS = pathlib.Path("reports"); REPORTS.mkdir(exist_ok=True)
          CACHE = pathlib.Path(".cache"); CACHE.mkdir(exist_ok=True)

          # 收集 CVE
          cves = set()
          for p in ["reports/grype-full.json", "reports/grype-full.sarif", "reports/trivy-full.sarif"]:
              fp = pathlib.Path(p)
              if not fp.exists(): continue
              cves |= set(re.findall(r'CVE-\d{4}-\d{4,7}', fp.read_text(encoding="utf-8", errors="replace")))
          cves = sorted(cves)
          print(f"收集到 {len(cves)} 個 CVE")

          enrichment = {}

          # KEV 清單：由前一步 scripts/fetch_kev.py 取得（官網 → 鏡像 → 快取），格式檢查與 g1_kev.py 共用。
          # feed 不可用 → kev_set = None：每筆 kev 記 null（未知），不是 false（incomplete ≠ pass，CLAUDE.md #2）
          import sys; sys.path.insert(0, "scripts")
          from g1_kev import load_kev
          kev_set, kev_released, kev_reason = None, None, None
          try:
              kev_src = json.loads(pathlib.Path("reports/kev-source.json").read_text(encoding="utf-8"))
          except Exception as e:
              kev_src = {"status": "unknown", "status_reason": f"來源紀錄無法讀取：{type(e).__name__}"}
          try:
              if kev_src.get("status") not in ("fetched", "cached"):
                  raise ValueError(kev_src.get("status_reason") or "KEV feed 未取得")
              kev_set, kev_released = load_kev(CACHE / "kev.json")
          except Exception as e:
              kev_set, kev_reason = None, f"KEV 未知：{type(e).__name__}: {e}"
              print(kev_reason)
          kev_checked_at = iso(NOW) if kev_set is not None else None

          # EPSS 逐一（或批次）查詢，附查詢日
          query_date = NOW.date().isoformat()
          for cve in cves:
              epss = None; epss_date = None
              try:
                  req = urllib.request.Request(f"https://api.first.org/data/v1/epss?cve={cve}",
                                               headers={"User-Agent": "vibesec-nightly"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      d = json.loads(r.read().decode("utf-8"))
                  rows = d.get("data", [])
                  if rows:
                      epss = rows[0].get("epss")
                      epss_date = rows[0].get("date")
              except Exception as e:
                  print(f"EPSS {cve} 失敗：{e}")
              enrichment[cve] = {
                  "epss": epss, "epss_date": epss_date, "epss_query_date": query_date,
                  # KEV 與日期分欄；feed 不可用時 kev/kev_date/kev_checked_at 皆 null 並附原因
                  "kev": (cve in kev_set) if kev_set is not None else None,
                  "kev_date": kev_set.get(cve) if kev_set is not None else None,
                  "kev_checked_at": kev_checked_at, "kev_catalog_released": kev_released,
                  "kev_source": kev_src.get("source") if kev_set is not None else None,
                  "kev_status_reason": kev_reason,
              }
          (REPORTS / "enrichment.json").write_text(json.dumps(enrichment, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"寫出 reports/enrichment.json（{len(enrichment)} 筆）")
          EOF

      # KEV 命中 → vibesec.g1.kev-hit（blocking）。不設 continue-on-error：有命中時 scripts/g1_kev.py 退出碼 1、
      # 缺 grype 結果或 KEV feed（下載失敗且無快取）時退出碼 2（incomplete ≠ pass，CLAUDE.md #2），兩者都讓 job 變紅並由 notify 開 issue。
      # SARIF 照常上傳（下一步 if: always()）。
      - name: G1 KEV 命中（vibesec.g1.kev-hit）
        run: |
          python3 scripts/g1_kev.py --grype reports/grype-full.json --kev-feed .cache/kev.json \
            --sarif reports/g1-kev.sarif --json reports/g1-kev.json --kev-source reports/kev-source.json

      - name: Upload KEV SARIF
        if: always() && hashFiles('reports/g1-kev.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/g1-kev.sarif
          category: vibesec-nightly-kev

      # 維護狀態 → vibesec.g1.unmaintained-dependency（advisory）：SBOM 套件逐一查 deps.dev（deprecated／最新版過舊）。
      # if: always()：KEV 命中讓前一步失敗時仍要查。不設 continue-on-error：缺 SBOM、API 失敗、查無套件 → 退出碼 2，
      # job 變紅並由 notify 開 issue（incomplete ≠ pass，CLAUDE.md #2）。advisory 命中本身不讓步驟失敗。
      - name: G1 維護狀態（vibesec.g1.unmaintained-dependency）
        if: always()
        run: |
          python3 scripts/g1_maintenance.py --sbom reports/sbom.cdx.json \
            --sarif reports/g1-maintenance.sarif --json reports/g1-maintenance.json

      - name: Upload 維護狀態 SARIF
        if: always() && hashFiles('reports/g1-maintenance.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/g1-maintenance.sarif
          category: vibesec-nightly-maintenance

      - name: Upload Grype full SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/grype-full.sarif
          category: vibesec-nightly-grype

      - name: Upload Trivy full SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/trivy-full.sarif
          category: vibesec-nightly-trivy

      - name: Upload nightly G1 artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesec-nightly-g1
          path: reports/
          if-no-files-found: ignore

  # SBOM 來源證明獨立成 job（第四次審視 CI-8）：簽章權限（id-token／attestations）不和第三方 action 同一個 job，
  # 否則被入侵的 syft／grype／trivy action 可用 OIDC 身分替任意 SBOM 簽出「本 workflow 簽發」的證明，
  # scripts/g1_provenance.py 的 --signer-workflow 檢查就擋不住。這裡只跑官方 attest action 與本 repo 的驗證腳本，
  # 輸入是 g1-full 上傳的 artifact；SBOM 缺席 → 驗證腳本退出碼 2（incomplete ≠ pass）。
  g1-attest:
    name: G1 SBOM 來源證明（簽發 + 驗證）
    needs: g1-full
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write        # Sigstore 以 OIDC 身分簽章
      attestations: write    # 寫入 GitHub attestations
      security-events: write # upload-sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            schemas
            config

      - name: 下載 g1-full 的 reports（含 sbom.cdx.json；缺席時由驗證腳本記為 incomplete）
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibesec-nightly-g1
          path: reports

      # 簽章前核對 SBOM 與 syft 剛產出時的雜湊：不一致（被同 job 的第三方工具改寫）或拿不到雜湊 → 不簽章，
      # 刪掉這份 SBOM，下一步驗證記為缺少證明／incomplete
      - name: 核對 SBOM 雜湊（syft 產出當下 vs 下載的 artifact）
        if: always() && hashFiles('reports/sbom.cdx.json') != ''
        env:
          EXPECTED: ${{ needs.g1-full.outputs.sbom_sha256 }}
        run: |
          ACTUAL=$(sha256sum reports/sbom.cdx.json | cut -d' ' -f1)
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::SBOM 雜湊不符（產出時 '${EXPECTED:-無}'、簽章前 '$ACTUAL'）：不簽章"
            rm -f reports/sbom.cdx.json
          else
            echo "SBOM 雜湊一致：$ACTUAL"
          fi

      # SBOM 來源證明：以 Sigstore 為 reports/sbom.cdx.json 簽發 SLSA provenance，再以 gh 驗證
      # 「存在、簽章有效、簽發者是本 workflow」。簽發失敗不在這裡擋：下一步驗證會把它記為缺少證明（advisory）。
      - name: 簽發 SBOM 來源證明（SLSA provenance）
        if: always() && hashFiles('reports/sbom.cdx.json') != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: reports/sbom.cdx.json

      # 驗證 → vibesec.g1.sbom-missing-provenance（advisory）。不設 continue-on-error：缺 SBOM、缺 gh、權限／網路錯誤
      # → 退出碼 2，job 變紅並由 notify 開 issue（incomplete ≠ pass，CLAUDE.md #2）。
      - name: G1 SBOM 來源證明（vibesec.g1.sbom-missing-provenance）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 scripts/g1_provenance.py --sbom reports/sbom.cdx.json --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/nightly-full.yml" \
            --sarif reports/g1-provenance.sarif --json reports/g1-provenance.json

      - name: Upload 來源證明 SARIF
        if: always() && hashFiles('reports/g1-provenance.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/g1-provenance.sarif
          category: vibesec-nightly-provenance

      - name: Upload 來源證明 artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesec-nightly-g1-provenance
          path: |
            reports/g1-provenance.sarif
            reports/g1-provenance.json
          if-no-files-found: ignore

  # G2 全 Git 歷史祕密掃描：PR Gates 的 gitleaks 只掃 PR 範圍的 commit，「曾經被提交、後來刪掉」的金鑰只有這裡看得到。
  # 判定與 PR Gates 相同：scripts/sarif_gate.py（gitleaks:* 依 cwe-map 對到 vibesec.g2.hardcoded-secret，blocking）。
  # 不是 pass（fail 或 incomplete）→ job 標紅並開追蹤 issue。命中的金鑰即使已撤銷也必須清歷史（docs/03）。
  g2-history:
    name: G2 全歷史祕密掃描（gitleaks git）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # upload-sarif
      actions: read            # upload-sarif 查詢 workflow run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # 排程只在 default branch 執行，工作區的鎖定檔就是 default branch 的版本（沒有 _trusted/）
      - name: 安裝 PyYAML（雜湊鎖定）
        uses: ./.github/actions/vibesec-pip-install
        with:
          requirements: requirements-ci.txt
          source: workspace
      # 與 evals job 相同：固定版本並比對官方 checksum，不符就失敗
      - name: 安裝 gitleaks（固定版本 + SHA-256 驗證）
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks 掃描全部歷史
        shell: bash
        run: |
          mkdir -p reports
          # --exit-code 0：有命中也回 0，由 sarif_gate.py 判定；非 0 = 工具錯誤 → 刪掉不完整的 SARIF，G2 記 incomplete
          # --ignore-gitleaks-allow：程式碼裡的 `# gitleaks:allow` 是受測方自己寫的，不採信（例外只能經 blocking-policy）
          # --log-opts --text：.gitattributes 設 binary／-diff 時 git log -p 只印 "Binary files differ"，gitleaks 完全看不到
          #   內容（實測 0 筆）；--text 強制以文字比對。--all --full-history 與 gitleaks 預設相同（掃所有 ref）
          set +e
          "$RUNNER_TEMP/gitleaks" git --config config/gitleaks.toml --gitleaks-ignore-path .gitleaksignore \
            --ignore-gitleaks-allow --log-opts="--text --all --full-history" \
            --redact --no-banner --exit-code 0 --report-format sarif --report-path reports/g2-history.sarif . 2>&1 | tail -5
          code=${PIPESTATUS[0]}
          set -e
          echo "gitleaks exit=$code"
          if [ "$code" != "0" ]; then rm -f reports/g2-history.sarif; echo "::error::gitleaks 執行失敗（exit $code）→ G2 incomplete"; fi
      - name: .env 檢查（與 PR Gates 相同格式）
        shell: bash
        run: |
          # env_guard.py --json：.gitignore 少規則、已提交的 .env、git 失敗分開記（以前壓成同一個 env_gitignore_fail）
          python3 scripts/env_guard.py --json > reports/g2-envcheck.json
      - name: G2 判定（scripts/sarif_gate.py）
        id: g2
        shell: bash
        run: |
          python3 scripts/sarif_gate.py --gate G2 --tool gitleaks=reports/g2-history.sarif \
            --envcheck reports/g2-envcheck.json --out reports/g2-history-gate.json
          python3 -I - <<'EOF'
          import json, os, sys
          sys.path.insert(0, "scripts")
          from gate_verdict import finalize, is_clean   # 乾淨＝最終判定為 pass 或 not_applicable（GLOSSARY.md「乾淨」）
          g = finalize(json.load(open("reports/g2-history-gate.json", encoding="utf-8")))
          fc = g.get("findings_count") or {}
          line = f"G2 全歷史：`{g['status']}`（blocking {fc.get('blocking')}，advisory {fc.get('advisory')}）{g.get('status_reason') or ''}"
          sp = os.environ.get("GITHUB_STEP_SUMMARY")
          if sp: open(sp, "a", encoding="utf-8").write("## " + line + "\n")
          print(line)
          sys.exit(0 if is_clean(g) else 1)
          EOF
      - name: Upload 全歷史 SARIF
        if: always() && hashFiles('reports/g2-history.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/g2-history.sarif
          category: vibesec-nightly-g2-history
      - name: Upload G2 全歷史 artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesec-nightly-g2-history
          path: reports/
          if-no-files-found: ignore

  evals:
    name: 評測（run_evals.py，對照 evals/baseline.yaml）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv（啟動本機靶場用）
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # 版本與遞移相依鎖在 requirements-evals.txt（含 SHA-256）；排程只在 default branch 執行，工作區即 default branch
      - name: 安裝 semgrep / checkov / PyYAML（雜湊鎖定）
        uses: ./.github/actions/vibesec-pip-install
        with:
          requirements: requirements-evals.txt
          source: workspace
      # gitleaks 不用 action（action 只掃 repo）；下載固定版本並比對官方 checksum，不符就失敗，不帶未驗證的二進位檔執行
      - name: 安裝 gitleaks（固定版本 + SHA-256 驗證）
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "VIBESEC_GITLEAKS=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"
      - name: 執行評測（靶場只在 127.0.0.1 啟動；CLAUDE.md 規則 8）
        # 退出碼 1 = 相對 baseline 退步（任何 FP／FN，或應實測的案例變成 untested／incomplete）→ job 標紅。
        # 不得以 continue-on-error 或縮減 baseline 讓它轉綠（CLAUDE.md 規則 1、2）。
        run: |
          python3 scripts/run_evals.py --baseline evals/baseline.yaml \
            --json reports/evals.json --md reports/evals.md
      - name: 評測摘要
        if: always()
        run: '[ -f reports/evals.md ] && cat reports/evals.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Upload evals artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesec-nightly-evals
          path: reports/
          if-no-files-found: ignore

  # 失敗通知：任一 job 失敗或取消 → 開（或在既有的追蹤 issue 留言）；恢復全綠 → 留言並關閉。
  # 只在 main 執行，避免分支上手動觸發的試跑開 issue。邏輯與單元測試在 .github/scripts/nightly-issue{,.test}.js。
  notify:
    name: 失敗通知（追蹤 issue）
    needs: [semgrep-full, g1-full, g1-attest, g2-history, evals]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: 下載 evals 結果（可能不存在：evals job 失敗時）
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibesec-nightly-evals
          path: _evals
      - name: 開／更新／關閉追蹤 issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const fs = require('fs');
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/nightly-issue.js`);
            const needs = JSON.parse(process.env.NEEDS_JSON);
            let evals = null;
            try { evals = JSON.parse(fs.readFileSync('_evals/evals.json', 'utf8')); } catch (e) { core.info(`無 evals.json：${e.message}`); }
            const r = await run({ github, context, core, needs, evals });
            core.info(`結果：${JSON.stringify(r)}`);
