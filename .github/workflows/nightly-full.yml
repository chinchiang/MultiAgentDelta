# VibeSec 夜間全量掃描 — 補齊 diff-aware 未覆蓋的全庫檢查
# 02:00 Asia/Taipei（= 18:00 UTC）。CodeQL 深度 SAST + 全量 Semgrep + 全量 G1（Syft/Grype/Trivy）+ EPSS/KEV 富化。
name: VibeSec Nightly Full Scan

on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC = 02:00 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL 深度 SAST（全量）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]   # repo 無 JS/TS 原始碼；actions = 掃描 workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: vibesec-nightly-codeql-${{ matrix.language }}

  semgrep-full:
    name: Semgrep 全量（無 baseline）
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep scan（全庫、無 diff baseline）
        continue-on-error: true
        run: |
          mkdir -p reports
          semgrep scan \
            --config config/semgrep/vibesec-rules.yaml \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --sarif --output reports/semgrep-full.sarif || true
      - name: Upload Semgrep full SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/semgrep-full.sarif
          category: vibesec-nightly-semgrep
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesec-nightly-semgrep
          path: reports/
          if-no-files-found: ignore

  g1-full:
    name: G1 全量供應鏈（Syft/Grype/Trivy + EPSS/KEV 富化）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore 富化快取（EPSS/KEV）
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: vibesec-enrich-${{ github.run_id }}
          restore-keys: |
            vibesec-enrich-

      - name: 安裝 Syft（官方 action，釘選 SHA）
        id: syft
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: 安裝 Grype（官方 action，釘選 SHA）
        id: grype
        continue-on-error: true
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      - name: 將 Syft / Grype 加入 PATH
        continue-on-error: true
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
        run: |
          [ -n "$SYFT_CMD" ] && dirname "$SYFT_CMD" >> "$GITHUB_PATH"
          [ -n "$GRYPE_CMD" ] && dirname "$GRYPE_CMD" >> "$GITHUB_PATH"
          true

      - name: Syft SBOM（全庫）+ Grype（SARIF + JSON）
        continue-on-error: true
        run: |
          mkdir -p reports
          if command -v syft >/dev/null 2>&1; then
            syft dir:. -o cyclonedx-json=reports/sbom.cdx.json
          fi
          if command -v grype >/dev/null 2>&1 && [ -f reports/sbom.cdx.json ]; then
            grype sbom:reports/sbom.cdx.json -o sarif --file reports/grype-full.sarif || true
            grype sbom:reports/sbom.cdx.json -o json --file reports/grype-full.json || true
          fi

      - name: Trivy 全庫掃描（SARIF）
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0（v0.0.1–v0.34.2 受 CVE-2026-33634 影響）
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: reports/trivy-full.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: EPSS / KEV 富化（inline python, stdlib；分欄記錄、不混算）
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          # 由 Grype/Trivy 輸出收集 CVE，查 FIRST EPSS 與 CISA KEV。
          # 不可違反：EPSS 與查詢日、KEV 與日期分欄記錄；不做 CVSS × EPSS × 信心 乘法。
          import json, re, pathlib, datetime, urllib.request, urllib.error, os
          NOW = datetime.datetime.now(datetime.timezone.utc)
          def iso(dt): return dt.replace(microsecond=0).isoformat()
          REPORTS = pathlib.Path("reports"); REPORTS.mkdir(exist_ok=True)
          CACHE = pathlib.Path(".cache"); CACHE.mkdir(exist_ok=True)

          # 收集 CVE
          cves = set()
          for p in ["reports/grype-full.json", "reports/grype-full.sarif", "reports/trivy-full.sarif"]:
              fp = pathlib.Path(p)
              if not fp.exists(): continue
              cves |= set(re.findall(r'CVE-\d{4}-\d{4,7}', fp.read_text(encoding="utf-8", errors="replace")))
          cves = sorted(cves)
          print(f"收集到 {len(cves)} 個 CVE")

          enrichment = {}

          # KEV 清單（整包快取 1 天）
          kev_cache = CACHE / "kev.json"
          kev_set = {}
          try:
              if kev_cache.exists() and (NOW.timestamp() - kev_cache.stat().st_mtime) < 86400:
                  kev_data = json.loads(kev_cache.read_text(encoding="utf-8"))
              else:
                  req = urllib.request.Request("https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json",
                                               headers={"User-Agent": "vibesec-nightly"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      kev_data = json.loads(r.read().decode("utf-8"))
                  kev_cache.write_text(json.dumps(kev_data), encoding="utf-8")
              for v in kev_data.get("vulnerabilities", []):
                  kev_set[v.get("cveID")] = v.get("dateAdded")
          except Exception as e:
              print(f"KEV 取得失敗：{e}")

          # EPSS 逐一（或批次）查詢，附查詢日
          query_date = NOW.date().isoformat()
          for cve in cves:
              epss = None; epss_date = None
              try:
                  req = urllib.request.Request(f"https://api.first.org/data/v1/epss?cve={cve}",
                                               headers={"User-Agent": "vibesec-nightly"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      d = json.loads(r.read().decode("utf-8"))
                  rows = d.get("data", [])
                  if rows:
                      epss = rows[0].get("epss")
                      epss_date = rows[0].get("date")
              except Exception as e:
                  print(f"EPSS {cve} 失敗：{e}")
              enrichment[cve] = {
                  "epss": epss, "epss_date": epss_date, "epss_query_date": query_date,
                  "kev": cve in kev_set, "kev_date": kev_set.get(cve),
              }
          (REPORTS / "enrichment.json").write_text(json.dumps(enrichment, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"寫出 reports/enrichment.json（{len(enrichment)} 筆）")
          EOF

      # KEV 命中 → vibesec.g1.kev-hit（blocking）。不設 continue-on-error：有命中時 scripts/g1_kev.py 退出碼 1、
      # 缺 grype 結果或 KEV feed（下載失敗且無快取）時退出碼 2（incomplete ≠ pass，CLAUDE.md #2），兩者都讓 job 變紅並由 notify 開 issue。
      # SARIF 照常上傳（下一步 if: always()）。
      - name: G1 KEV 命中（vibesec.g1.kev-hit）
        run: |
          python3 scripts/g1_kev.py --grype reports/grype-full.json --kev-feed .cache/kev.json \
            --sarif reports/g1-kev.sarif --json reports/g1-kev.json

      - name: Upload KEV SARIF
        if: always() && hashFiles('reports/g1-kev.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/g1-kev.sarif
          category: vibesec-nightly-kev

      # 維護狀態 → vibesec.g1.unmaintained-dependency（advisory）：SBOM 套件逐一查 deps.dev（deprecated／最新版過舊）。
      # if: always()：KEV 命中讓前一步失敗時仍要查。不設 continue-on-error：缺 SBOM、API 失敗、查無套件 → 退出碼 2，
      # job 變紅並由 notify 開 issue（incomplete ≠ pass，CLAUDE.md #2）。advisory 命中本身不讓步驟失敗。
      - name: G1 維護狀態（vibesec.g1.unmaintained-dependency）
        if: always()
        run: |
          python3 scripts/g1_maintenance.py --sbom reports/sbom.cdx.json \
            --sarif reports/g1-maintenance.sarif --json reports/g1-maintenance.json

      - name: Upload 維護狀態 SARIF
        if: always() && hashFiles('reports/g1-maintenance.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/g1-maintenance.sarif
          category: vibesec-nightly-maintenance

      - name: Upload Grype full SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/grype-full.sarif
          category: vibesec-nightly-grype

      - name: Upload Trivy full SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/trivy-full.sarif
          category: vibesec-nightly-trivy

      - name: Upload nightly G1 artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesec-nightly-g1
          path: reports/
          if-no-files-found: ignore

  evals:
    name: 評測（run_evals.py，對照 evals/baseline.yaml）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv（啟動本機靶場用）
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: 安裝 semgrep / checkov / PyYAML
        run: pip install pyyaml semgrep==1.179.0 checkov==3.3.22
      # gitleaks 不用 action（action 只掃 repo）；下載固定版本並比對官方 checksum，不符就失敗，不帶未驗證的二進位檔執行
      - name: 安裝 gitleaks（固定版本 + SHA-256 驗證）
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "VIBESEC_GITLEAKS=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"
      - name: 執行評測（靶場只在 127.0.0.1 啟動；CLAUDE.md 規則 8）
        # 退出碼 1 = 相對 baseline 退步（任何 FP／FN，或應實測的案例變成 untested／incomplete）→ job 標紅。
        # 不得以 continue-on-error 或縮減 baseline 讓它轉綠（CLAUDE.md 規則 1、2）。
        run: |
          python3 scripts/run_evals.py --baseline evals/baseline.yaml \
            --json reports/evals.json --md reports/evals.md
      - name: 評測摘要
        if: always()
        run: '[ -f reports/evals.md ] && cat reports/evals.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Upload evals artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesec-nightly-evals
          path: reports/
          if-no-files-found: ignore

  # 失敗通知：任一 job 失敗或取消 → 開（或在既有的追蹤 issue 留言）；恢復全綠 → 留言並關閉。
  # 只在 main 執行，避免分支上手動觸發的試跑開 issue。邏輯與單元測試在 .github/scripts/nightly-issue{,.test}.js。
  notify:
    name: 失敗通知（追蹤 issue）
    needs: [codeql, semgrep-full, g1-full, evals]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: 下載 evals 結果（可能不存在：evals job 失敗時）
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibesec-nightly-evals
          path: _evals
      - name: 開／更新／關閉追蹤 issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const fs = require('fs');
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/nightly-issue.js`);
            const needs = JSON.parse(process.env.NEEDS_JSON);
            let evals = null;
            try { evals = JSON.parse(fs.readFileSync('_evals/evals.json', 'utf8')); } catch (e) { core.info(`無 evals.json：${e.message}`); }
            const r = await run({ github, context, core, needs, evals });
            core.info(`結果：${JSON.stringify(r)}`);
