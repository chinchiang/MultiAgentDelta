# VibeSec Staging 黑箱 — G5 DAST/API + G6 LLM/Agent 紅隊（由外而內）
# 部署至 Staging 後、上線前執行；每週定期複測。
# 不可違反（CLAUDE.md #8）：攻擊性探針只能對 VIBESEC_TARGET_URL 指向的、已授權的測試環境執行。
# incomplete ≠ pass：目標無法連線／缺帳號 token → 閘門 incomplete，絕不通過。
name: VibeSec Staging Blackbox

on:
  # 不接受手動輸入參數（Checkov CKV_GHA_7 / SLSA）：攻擊目標只能由管理者設定的
  # Actions 變數 vars.VIBESEC_TARGET_URL 指定；未設定則只打 job 內啟動的靶場。
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"   # 每週日 20:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  blackbox:
    name: G5 DAST/API + G6 AI 紅隊
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 給 notify job 判斷用：目標種類與 G5／G6 閘門結論（只含狀態與計數，不含 token 或回應內容）
    outputs:
      is_vulnapp: ${{ steps.target.outputs.is_vulnapp }}
      g5_status: ${{ steps.verdict.outputs.g5_status }}
      g5_blocking: ${{ steps.verdict.outputs.g5_blocking }}
      g6_status: ${{ steps.verdict.outputs.g6_status }}
      g6_blocking: ${{ steps.verdict.outputs.g6_blocking }}
    # 執行期才從 registry 抓的工具一律釘版（與 actions 釘 SHA 同理）：浮動的 @latest／未釘版 pip 會讓上游被入侵的版本
    # 直接在持有 LLM 金鑰的步驟裡執行（vibesec-harness G0 發現：供應鏈層致命三要素）。版本須已發布滿
    # vibesec.yaml cooldown_days（14）天；Dependabot 不管這兩個，升版請手動確認發布日。
    env:
      PROMPTFOO_VERSION: "0.123.1"   # npm，2026-09-18 發布；npm 依 registry 的 integrity（sha512）驗證套件
      GARAK_VERSION: "0.17.0"        # PyPI，2026-09-09 發布
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: 安裝閘門必要套件
        run: pip install --require-hashes -r requirements-ci.txt

      - name: 建置無憑證的紅隊工具映像 / Build red-team image without credentials
        id: runtime_image
        continue-on-error: true
        run: docker build -f config/runtime/Dockerfile --build-arg PROMPTFOO_VERSION --build-arg GARAK_VERSION -t vibesec-redteam:local .

      - name: Install uv
        continue-on-error: true
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: 啟動靶場 examples/vulnapp（當未設定 vars.VIBESEC_TARGET_URL）
        id: target
        shell: bash
        env:
          INPUT_TARGET_URL: ${{ vars.VIBESEC_TARGET_URL }}
        run: |
          mkdir -p reports
          INPUT_URL="${INPUT_TARGET_URL}"
          if [ -n "$INPUT_URL" ]; then
            echo "使用外部已授權目標：$INPUT_URL"
            echo "url=$INPUT_URL" >> "$GITHUB_OUTPUT"
            echo "is_vulnapp=false" >> "$GITHUB_OUTPUT"
          else
            echo "未設定 vars.VIBESEC_TARGET_URL → 啟動 examples/vulnapp 靶場（僅打靶場）"
            export PATH="$HOME/.local/bin:$PATH"
            nohup uv run --project examples/vulnapp uvicorn app.main:app --host 0.0.0.0 --port 8000 > reports/_vulnapp.log 2>&1 &
            echo "url=http://127.0.0.1:8000" >> "$GITHUB_OUTPUT"
            echo "is_vulnapp=true" >> "$GITHUB_OUTPUT"
            # wait-for-ready
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8000/openapi.json >/dev/null 2>&1 || curl -sf http://127.0.0.1:8000/ >/dev/null 2>&1; then
                echo "靶場就緒"; break
              fi
              sleep 2
            done
          fi

      - name: 取得雙帳號 token（靶場登入 seeded users，否則取自 secrets）
        id: tokens
        shell: bash
        env:
          SECRET_TOKEN_A: ${{ secrets.VIBESEC_TOKEN_A }}
          SECRET_TOKEN_B: ${{ secrets.VIBESEC_TOKEN_B }}
          TARGET_URL: ${{ steps.target.outputs.url }}
          IS_VULNAPP: ${{ steps.target.outputs.is_vulnapp }}
        run: |
          URL="${TARGET_URL}"
          extract() { python3 -c "import sys,json;
          try:
              d=json.load(sys.stdin)
          except Exception:
              print(''); sys.exit()
          print(d.get('access_token') or d.get('token') or d.get('jwt') or '')"; }
          if [ "${IS_VULNAPP}" = "true" ]; then
            TA=$(curl -s -X POST "$URL/login" -H 'Content-Type: application/json' -d '{"username":"alice","password":"alice-pass"}' | extract)
            TB=$(curl -s -X POST "$URL/login" -H 'Content-Type: application/json' -d '{"username":"bob","password":"bob-pass"}' | extract)
          else
            TA="$SECRET_TOKEN_A"; TB="$SECRET_TOKEN_B"
          fi
          # 不回顯 token 內容；僅標記是否取得
          [ -n "$TA" ] && echo "has_a=true" >> "$GITHUB_OUTPUT" || echo "has_a=false" >> "$GITHUB_OUTPUT"
          [ -n "$TB" ] && echo "has_b=true" >> "$GITHUB_OUTPUT" || echo "has_b=false" >> "$GITHUB_OUTPUT"
          # token 只寫入 runner 暫存檔（0600），不進 GITHUB_ENV、不經 log
          umask 077
          TOKDIR="$RUNNER_TEMP/vibesec-tokens"; mkdir -p "$TOKDIR"
          printf '%s' "$TA" > "$TOKDIR/a"; printf '%s' "$TB" > "$TOKDIR/b"
          echo "token_dir=$TOKDIR" >> "$GITHUB_OUTPUT"

      # ---------- G5：ZAP ----------
      - name: ZAP API Scan（OpenAPI）
        id: zap_api
        continue-on-error: true
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: ${{ steps.target.outputs.url }}/openapi.json
          format: openapi
          rules_file_name: config/zap/api-scan.conf
          cmd_options: "-I"
          fail_action: false
          allow_issue_writing: false
          artifact_name: vibesec-zap-api

      - name: 保存 ZAP API 報告
        if: always()
        run: |
          if [ -f report_json.json ]; then mv report_json.json reports/zap-api.json; fi

      - name: ZAP Baseline Scan
        id: zap_baseline
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          rules_file_name: config/zap/api-scan.conf
          cmd_options: "-I"
          fail_action: false
          allow_issue_writing: false
          artifact_name: vibesec-zap-baseline

      - name: 保存 ZAP Baseline 報告
        if: always()
        run: |
          if [ -f report_json.json ]; then mv report_json.json reports/zap-baseline.json; fi

      # ---------- G5：api-probes（stdlib urllib）----------
      - name: G5 api-probes（雙帳號 BOLA / JWT / SSRF / 設定外溢 / rate-limit）
        continue-on-error: true
        env:
          VIBESEC_TARGET_URL: ${{ steps.target.outputs.url }}
          HAS_A: ${{ steps.tokens.outputs.has_a }}
          HAS_B: ${{ steps.tokens.outputs.has_b }}
          VIBESEC_TOKEN_DIR: ${{ steps.tokens.outputs.token_dir }}
          VIBESEC_ACCESS_CONTEXT: ${{ steps.target.outputs.is_vulnapp == 'true' && 'config/zap/vulnapp-context.yaml' || 'config/zap/two-account-context.yaml' }}
          VIBESEC_USER_ID_A: ${{ steps.target.outputs.is_vulnapp == 'true' && '1' || vars.VIBESEC_USER_ID_A }}
        run: |
          python3 scripts/g5_api_probes.py

      - name: Upload G5 api-probes SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/g5-api-probes.sarif
          category: vibesec-g5-api-probes

      # G5 是唯一需要帳號 token 的步驟：G5 一結束就刪，之後執行的第三方工具（promptfoo、garak）讀不到。
      # job 結尾的清除步驟保留，作為失敗時的保險。
      - name: 清除 token 暫存檔（G5 結束即刪）
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/vibesec-tokens"

      - name: G5 彙整 API 與 ZAP 報告
        if: always()
        env:
          ZAP_API_OUTCOME: ${{ steps.zap_api.outcome }}
          ZAP_BASELINE_OUTCOME: ${{ steps.zap_baseline.outcome }}
        run: |
          python3 scripts/g5_gate.py --probes reports/g5-gate.json \
            --zap-api reports/zap-api.json --zap-baseline reports/zap-baseline.json --out reports/g5-gate.json \
            --zap-api-outcome "$ZAP_API_OUTCOME" --zap-baseline-outcome "$ZAP_BASELINE_OUTCOME"

      # ---------- G6：LLM / Agent 紅隊 ----------
      - name: G6 promptfoo eval（決定性測試，不需模型金鑰）
        id: pfeval
        continue-on-error: true
        shell: bash
        env:
          VIBESEC_TARGET_URL: ${{ steps.target.outputs.url }}
          PROMPTFOO_DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p reports
          # 退出碼 100 = 有測試失敗（正常結果，交給 g6_gate.py 判定 fail）；其他非零 = 工具錯誤
          set +e
          python3 scripts/isolated_redteam.py eval --image vibesec-redteam:local
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "promptfoo eval exit=$code"

      # 生成層：只有設定 ANTHROPIC_API_KEY 或 OPENAI_API_KEY secret 時執行。
      # 靶場回應屬 internal，依 config/providers.yaml 只允許 anthropic-cloud / openai-cloud（CLAUDE.md 規則 7）；
      # GLM / DeepSeek 只允許 public，不在此使用。金鑰只經 env 傳入，不寫入 log。
      - name: G6 promptfoo redteam（選用；需 ANTHROPIC_API_KEY 或 OPENAI_API_KEY secret）
        id: pfred
        continue-on-error: true
        shell: bash
        env:
          VIBESEC_TARGET_URL: ${{ steps.target.outputs.url }}
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          # 不用 promptfoo 雲端遠端生成：purpose 與靶場回應不得送往 providers.yaml 以外的服務（CLAUDE.md 規則 7）
          PROMPTFOO_DISABLE_REMOTE_GENERATION: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p reports
          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "skipped=未設定 ANTHROPIC_API_KEY / OPENAI_API_KEY secret" >> "$GITHUB_OUTPUT"
            echo "::notice::redteam 生成層未執行：未設定 ANTHROPIC_API_KEY / OPENAI_API_KEY secret（記為 untested）"
            exit 0
          fi
          # 金鑰留在容器外；第三方工具僅可呼叫受限轉接器。 / Keep keys outside the tool container.
          set +e
          python3 scripts/isolated_redteam.py redteam --image vibesec-redteam:local
          code=$?
          set -e
          echo "redteam exit=$code"
          if [ ! -s reports/g6-promptfoo-redteam.json ]; then
            echo "skipped=promptfoo redteam 執行失敗（exit=$code），未產生結果；見 _promptfoo-redteam.log" >> "$GITHUB_OUTPUT"
          fi

      - name: G6 garak（LLM 漏洞掃描）
        continue-on-error: true
        shell: bash
        env:
          VIBESEC_TARGET_URL: ${{ steps.target.outputs.url }}
        run: |
          mkdir -p reports/garak
          # 建置失敗或隔離失敗必須保持未完成，不回退到主機執行。 / Never fall back to host execution.
          code=0
          python3 scripts/isolated_redteam.py garak --image vibesec-redteam:local --output reports/garak || code=$?
          if [ -f reports/garak/_garak.log ]; then cp reports/garak/_garak.log reports/_garak.log; fi
          exit "$code"

      - name: G6 工具事件與用量遙測
        continue-on-error: true
        env:
          VIBESEC_TARGET_URL: ${{ steps.target.outputs.url }}
        run: python3 scripts/g6_observe.py --out reports/g6-observations.json

      - name: G6 彙整（promptfoo eval + redteam + garak → reports/g6-gate.json）
        if: always()
        shell: bash
        env:
          PF_EXIT: ${{ steps.pfeval.outputs.exit_code }}
          PF_RED_SKIPPED: ${{ steps.pfred.outputs.skipped }}
        run: |
          args=(--eval reports/g6-promptfoo.json --garak-glob 'reports/garak/g6-garak*.report.jsonl' --garak-log reports/_garak.log --garak-config config/garak/vibesec.probes.yaml
                --gate reports/g6-gate.json --sarif reports/g6.sarif --observations reports/g6-observations.json)
          [ -n "${PF_EXIT:-}" ] && args+=(--eval-exit-code "$PF_EXIT")
          if [ -n "${PF_RED_SKIPPED:-}" ]; then args+=(--redteam-skipped "$PF_RED_SKIPPED")
          else args+=(--redteam reports/g6-promptfoo-redteam.json); fi
          python3 scripts/g6_gate.py "${args[@]}"

      - name: Upload G6 SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/g6.sarif
          category: vibesec-g6-ai-red-team

      - name: 黑箱彙整（G5/G6 狀態；shadow 僅報告）
        id: verdict
        if: always()
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, glob, os, pathlib
          rows = ["# VibeSec 黑箱閘門狀態（G5 / G6）", "",
                  "| 閘門 | 狀態 | blocking | advisory | 說明 |", "|---|---|---|---|---|"]
          for p in sorted(glob.glob("reports/g5-gate.json") + glob.glob("reports/g6-gate.json")):
              try: g = json.load(open(p, encoding="utf-8"))
              except Exception: continue
              fc = g.get("findings_count", {})
              rows.append(f"| {g.get('gate')} | `{g.get('status')}` | {fc.get('blocking','-')} | {fc.get('advisory','-')} | {g.get('status_reason') or ''} |")
          rows += ["", "> 攻擊性探針僅對已授權 VIBESEC_TARGET_URL 執行；缺 token／目標限制的檢查記為 untested，incomplete ≠ pass。"]
          text = "\n".join(rows)
          # 供 notify job 使用；缺 gate 檔記為 missing（incomplete ≠ pass）
          go = os.environ.get("GITHUB_OUTPUT")
          if go:
              with open(go, "a", encoding="utf-8") as fh:
                  for gid in ("g5", "g6"):
                      try:
                          g = json.load(open(f"reports/{gid}-gate.json", encoding="utf-8"))
                          st, bl = g.get("status") or "missing", (g.get("findings_count") or {}).get("blocking", "")
                      except Exception:
                          st, bl = "missing", ""
                      fh.write(f"{gid}_status={st}\n{gid}_blocking={bl}\n")
          sp = os.environ.get("GITHUB_STEP_SUMMARY")
          if sp: open(sp, "a", encoding="utf-8").write(text + "\n")
          print(text)
          EOF

      - name: 黑箱最終判定（靶場驗收／部署政策）
        if: always()
        env:
          IS_LAB: ${{ steps.target.outputs.is_vulnapp }}
        run: |
          args=()
          [ "$IS_LAB" = "true" ] && args+=(--lab)
          python3 scripts/gate_verdict.py --gate G5=reports/g5-gate.json --gate G6=reports/g6-gate.json "${args[@]}"

      - name: Upload 黑箱 reports（artifact）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesec-blackbox-reports
          path: reports/
          if-no-files-found: ignore

      - name: 清除 token 暫存檔
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/vibesec-tokens"

  # 失敗通知：靶場上偵測退步、外部目標 fail／incomplete、job 失敗或缺閘門結果 → 開／更新追蹤 issue；恢復 → 自動關閉。
  # 判定邏輯與單元測試：.github/scripts/staging-issue.js、staging-issue.test.js。
  notify:
    name: 失敗通知（追蹤 issue）
    needs: [blackbox]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: 開／更新／關閉追蹤 issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BLACKBOX_JSON: ${{ toJSON(needs.blackbox) }}
        with:
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/staging-issue.js`);
            const blackbox = JSON.parse(process.env.BLACKBOX_JSON);
            const r = await run({ github, context, core, blackbox });
            core.info(`結果：${JSON.stringify(r)}`);
