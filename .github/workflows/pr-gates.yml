# VibeSec PR 閘門 — G1 供應鏈 / G2 機密 / G3 SAST+IaC / G4 存取控制（diff-aware、白箱）
# 由內而外、每次 pull_request 執行。語意見 docs/08-harness-agent.md。
# 不可違反：incomplete ≠ pass（工具缺席／逾時／API 失敗 → 閘門 incomplete 且絕不通過）。
name: VibeSec PR Gates

on:
  pull_request:
    # edited：改 PR 的目標分支也要重跑（受信任程式已改取 default branch，但 diff／過期判斷仍用 base）
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# 最小權限：workflow 層級只給 read；寫入權限由需要的 job 各自宣告（job 層級會整組取代這裡）。
# 同 repo 分支的 PR 會拿到可寫的 GITHUB_TOKEN，所以不讓每個 job（含第三方 action）都繼承寫入權。
permissions:
  contents: read

concurrency:
  group: vibesec-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # G1 供應鏈與 Slopsquatting —— order: first（惡意 postinstall 於安裝瞬間執行，必須最先跑）
  g1-supply-chain:
    name: G1 供應鏈與 Slopsquatting
    permissions:
      contents: read
      security-events: write   # upload-sarif
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（full history for diff）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # 判定程式、規則、設定與 mode 一律取自 default branch（_trusted/），PR head 只當被掃描的資料；
      # 細節見 .github/actions/vibesec-trusted/action.yml。
      - name: 取出受信任的判定程式與設定（default branch → _trusted/）
        id: trusted
        uses: ./.github/actions/vibesec-trusted

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # 從雜湊鎖定檔安裝（default branch 的 requirements-ci.txt），見 .github/actions/vibesec-pip-install
      - name: 安裝 PyYAML（供 blacklist/allowlist 解析，best-effort；雜湊鎖定）
        continue-on-error: true
        uses: ./.github/actions/vibesec-pip-install
        with:
          requirements: requirements-ci.txt

      - name: 偵測變更的 manifest 檔
        id: diff
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p reports
          BASE="origin/${BASE_REF}"
          if [ -z "${BASE_REF}" ]; then BASE="HEAD~1"; fi
          [ -n "${BASE_REF}" ] && git fetch origin "${BASE_REF}" 2>/dev/null || true
          CHANGED=$(git diff --name-only "${BASE}...HEAD" 2>/dev/null || git diff --name-only HEAD~1...HEAD)
          echo "$CHANGED" | grep -v '^_trusted/' > reports/_changed-files.txt || true
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "變更檔案："; cat reports/_changed-files.txt

      - name: G1 四層快篩（scripts/g1_slopcheck.py）
        id: slopcheck
        continue-on-error: ${{ steps.trusted.outputs.shadow == 'true' }}
        shell: bash
        env:
          DIFF_BASE: ${{ steps.diff.outputs.base }}
        run: |
          # 與 pre-commit 共用同一支腳本：diff-aware、套用 blocking-policy exceptions、
          # 掃描變更的 agent 規則檔；輸出 SARIF 與 gate-result。exit 1 = blocking、2 = incomplete。
          python3 _trusted/scripts/g1_slopcheck.py --target . \
            --changed-files reports/_changed-files.txt \
            --base "$DIFF_BASE" \
            --sarif reports/g1-slopcheck.sarif \
            --gate reports/g1-gate.json \
            > reports/g1-slopcheck.json

      - name: Upload SlopCheck SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/g1-slopcheck.sarif
          category: vibesec-g1-slopcheck

      - name: 安裝 Syft（官方 action，釘選 SHA）
        id: syft
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: 安裝 Grype（官方 action，釘選 SHA）
        id: grype
        continue-on-error: true
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      - name: 將 Syft / Grype 加入 PATH
        continue-on-error: true
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
        run: |
          [ -n "$SYFT_CMD" ] && dirname "$SYFT_CMD" >> "$GITHUB_PATH"
          [ -n "$GRYPE_CMD" ] && dirname "$GRYPE_CMD" >> "$GITHUB_PATH"
          true

      # SBOM（VS-G1-SBOM）：g1_sbom.py 從 HEAD 匯出乾淨的樹，以 syft 產生兩次並比對（可重現），再核對每個鎖定檔
      # 釘選的套件都在 SBOM（含 npm devDependencies）；缺漏 → vibesec.g1.sbom-incomplete，結果併入 g1-gate.json。
      # 缺 syft、syft 失敗或無法核對 → incomplete（exit 2）。與 KEV 相同：shadow 模式下不讓 job 變紅。
      - name: 產生並驗證 SBOM（scripts/g1_sbom.py）
        id: sbom
        continue-on-error: ${{ steps.trusted.outputs.shadow == 'true' }}
        run: |
          python3 _trusted/scripts/g1_sbom.py --target . --sbom reports/sbom.cdx.json \
            --sarif reports/g1-sbom.sarif --json reports/g1-sbom.json --merge-gate reports/g1-gate.json

      - name: Upload SBOM SARIF
        if: always() && hashFiles('reports/g1-sbom.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/g1-sbom.sarif
          category: vibesec-g1-sbom

      - name: 漏洞掃描（Grype：SBOM → SARIF）
        id: grype-scan
        if: always()
        continue-on-error: true
        run: |
          mkdir -p reports
          if command -v grype >/dev/null 2>&1 && [ -f reports/sbom.cdx.json ]; then
            grype sbom:reports/sbom.cdx.json -o sarif --file reports/grype.sarif || true
            grype sbom:reports/sbom.cdx.json -o json --file reports/grype.json || true
          else
            echo "grype 缺席或無 SBOM → incomplete"; echo "grype_missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Grype SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/grype.sarif
          category: vibesec-g1-grype

      # KEV feed：先取 nightly 在 main 留下的快取，再以 fetch_kev.py 下載最新版（官網 → cisagov/kev-data 鏡像）；
      # 下載失敗就沿用快取（reports/kev-source.json 與 g1_kev.py 摘要記錄來源與 feed 發布時間，看得出是否用了舊資料）。
      # 皆無 → 不寫出 feed，KEV 檢查 incomplete、G1 的 KEV 控制記 untested（incomplete ≠ pass）。
      - name: Restore KEV 快取（nightly 富化快取）
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: vibesec-enrich-pr-${{ github.run_id }}
          restore-keys: |
            vibesec-enrich-

      - name: 下載 CISA KEV feed
        continue-on-error: true
        run: |
          mkdir -p .cache reports
          python3 _trusted/scripts/fetch_kev.py --out .cache/kev.json --meta reports/kev-source.json

      # KEV 命中 → vibesec.g1.kev-hit（blocking），結果併入 g1-gate.json，由 summary 依 mode 決定是否阻擋。
      # 與 slopcheck 相同：shadow 模式下不讓 job 變紅；enforce 模式下命中（exit 1）或 incomplete（exit 2）都會擋。
      - name: G1 KEV 命中（vibesec.g1.kev-hit）
        id: kev
        continue-on-error: ${{ steps.trusted.outputs.shadow == 'true' }}
        run: |
          python3 _trusted/scripts/g1_kev.py --grype reports/grype.json --kev-feed .cache/kev.json \
            --sarif reports/g1-kev.sarif --json reports/g1-kev.json --merge-gate reports/g1-gate.json \
            --kev-source reports/kev-source.json

      - name: Upload KEV SARIF
        if: always() && hashFiles('reports/g1-kev.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/g1-kev.sarif
          category: vibesec-g1-kev

      - name: Trivy 檔案系統掃描（vuln → SARIF）
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0（v0.0.1–v0.34.2 受 CVE-2026-33634 影響）
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: _trusted
          format: sarif
          output: reports/trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/trivy-fs.sarif
          category: vibesec-g1-trivy

      - name: Upload G1 reports（artifact）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesec-g1-reports
          path: reports/
          if-no-files-found: ignore

  # G2 機密與金鑰（PR 範圍的 commit：base..HEAD，含 merge 帶入的 commit）
  # 全 Git 歷史（含已刪除的舊金鑰）由 nightly-full.yml 的 g2-history job 每晚掃描。
  g2-secrets:
    name: G2 機密與金鑰
    permissions:
      contents: read
      security-events: write   # upload-sarif
    needs: g1-supply-chain
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # 判定程式、規則、設定與 mode 一律取自 default branch（_trusted/），PR head 只當被掃描的資料；
      # 細節見 .github/actions/vibesec-trusted/action.yml。
      - name: 取出受信任的判定程式與設定（default branch → _trusted/）
        id: trusted
        uses: ./.github/actions/vibesec-trusted

      # 以前用 gitleaks-action：它無法帶旗標，會採信受測方的 `# gitleaks:allow`、被 .gitattributes 的 binary／-diff
      # 蒙蔽（git log -p 只印 Binary files differ），且以 --no-merges --first-parent 掃描，漏掉經 merge 帶進來的 commit
      # （三者皆已實測）。改成與 nightly 相同、比對 checksum 的 gitleaks 二進位，旗標由我們決定。
      - name: Gitleaks（PR 範圍的 commit；不採信 gitleaks:allow 與 .gitattributes）
        id: gitleaks
        continue-on-error: ${{ steps.trusted.outputs.shadow == 'true' }}
        shell: bash
        env:
          GITLEAKS_VERSION: "8.28.0"   # 與 pre-commit、nightly 同版
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          # PR：base..HEAD（HEAD 是 PR 的 merge commit，含 merge 帶入的 commit）；手動觸發沒有 base → 只掃 HEAD 這個 commit
          if [ -n "${BASE_SHA}" ]; then RANGE="${BASE_SHA}..HEAD"; else RANGE="-1 HEAD"; fi
          # --exit-code 0：有命中也回 0，由 sarif_gate.py 判定；非 0 = 工具錯誤 → 不留不完整的 SARIF，G2 記 incomplete
          set +e
          "$RUNNER_TEMP/gitleaks" git . --config _trusted/config/gitleaks.toml --gitleaks-ignore-path .gitleaksignore \
            --ignore-gitleaks-allow --log-opts="--text ${RANGE}" \
            --redact --no-banner --exit-code 0 --report-format sarif --report-path results.sarif 2>&1 | tail -5
          code=${PIPESTATUS[0]}
          set -e
          echo "gitleaks exit=$code（範圍：${RANGE}）"
          if [ "$code" != "0" ]; then rm -f results.sarif; echo "::error::gitleaks 執行失敗（exit $code）→ G2 incomplete"; exit "$code"; fi

      - name: 檢查 .env 是否在 .gitignore 且無已追蹤的 .env 檔
        continue-on-error: ${{ steps.trusted.outputs.shadow == 'true' }}
        shell: bash
        env:
          VIBESEC_MODE: ${{ steps.trusted.outputs.mode }}
        run: |
          mkdir -p reports
          # 判定交給受信任的 scripts/env_guard.py --json（與 pre-commit、g2_secrets.py 同一份邏輯）：三種結果分開記
          # （.gitignore 少規則、已提交的 .env、git 失敗 → incomplete）。以前這裡另寫一份 bash：.gitignore 只要有任一行
          # 含 .env（.env.example、!.env 反向規則）就算通過，與腳本的 git 語意判斷不一致。
          # CI 取 _trusted/（default branch）；run_evals.py 在暫存目錄執行時由 VIBESEC_CONFIG 找 repo 根
          ROOT=$(dirname "${VIBESEC_CONFIG:-$PWD/_trusted/vibesec.yaml}")
          if ! python3 -I "$ROOT/scripts/env_guard.py" --target . --json > reports/g2-envcheck.json; then
            rm -f reports/g2-envcheck.json   # 缺檔 → summary 判 G2 incomplete（不是 pass）
            echo "::error::env_guard.py 執行失敗：無法確認 .env 未入版控"; exit 1
          fi
          eval "$(python3 -I - reports/g2-envcheck.json <<'PY'
          import json, shlex, sys
          r = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"gi_fail={int(r['env_gitignore_fail'])}")
          print(f"TRACKED={shlex.quote(chr(10).join(r['committed']))}")
          print(f"ENV_ERROR={shlex.quote(r['error'] or '')}")
          PY
          )"
          if [ "$gi_fail" = "1" ]; then echo "::error::.env 未被 .gitignore 忽略（require_env_in_gitignore: true）"; else echo "OK: .env 已被 .gitignore 忽略"; fi
          if [ -n "$ENV_ERROR" ]; then echo "::error::$ENV_ERROR"; fi
          if [ -n "$TRACKED" ]; then
            echo "::error::偵測到已追蹤的 .env 檔："; echo "$TRACKED"
          elif [ -z "$ENV_ERROR" ]; then
            echo "OK: 無已追蹤的 .env 檔"
          fi
          TIER=$(python3 "$ROOT/scripts/vibesec_policy.py" vibesec.g2.env-not-ignored | awk '{print $2}')
          TIER_COMMITTED=$(python3 "$ROOT/scripts/vibesec_policy.py" vibesec.g2.env-committed | awk '{print $2}')
          echo "policy tier: env-not-ignored=${TIER} env-committed=${TIER_COMMITTED}"
          if [ "${VIBESEC_MODE}" = "enforce" ]; then
            if [ "$gi_fail" = "1" ] && [ "$TIER" = "blocking" ]; then exit 1; fi
            if [ -n "$TRACKED" ] && [ "$TIER_COMMITTED" = "blocking" ]; then exit 1; fi
          fi

      - name: Upload Gitleaks SARIF（若產生）
        if: always() && hashFiles('results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: vibesec-g2-gitleaks

      # summary 以 scripts/sarif_gate.py 從這些輸出推導 G2 gate JSON；檔案缺席 → G2 incomplete（不是 pass）
      - name: 整理 G2 reports（gitleaks SARIF 複製進 reports/）
        if: always()
        shell: bash
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          mkdir -p reports
          # 只採用 gitleaks 這一步真的產生的檔；步驟被略過時工作區的 results.sarif 不是掃描結果（vibesec-trusted 已先清掉）
          if [ "$GITLEAKS_OUTCOME" != "skipped" ] && [ -f results.sarif ]; then cp results.sarif reports/gitleaks.sarif; fi
      - name: Upload G2 artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesec-g2-reports
          path: reports/
          if-no-files-found: ignore

  # G3 SAST 與 IaC（diff-aware；跨檔污點分析 + IaC 設定掃描）
  g3-sast-iac:
    name: G3 SAST 與 IaC
    permissions:
      contents: read
      security-events: write   # upload-sarif
    needs: g2-secrets
    if: always()
    runs-on: ubuntu-latest
    container:
      # 釘選版本（與 evals 的 semgrep==1.179.0 一致）。tag 仍可被發布者移動；查不到 digest 時先釘 tag，之後再補 @sha256
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # 判定程式、規則、設定與 mode 一律取自 default branch（_trusted/），PR head 只當被掃描的資料；
      # 細節見 .github/actions/vibesec-trusted/action.yml。
      - name: 取出受信任的判定程式與設定（default branch → _trusted/）
        id: trusted
        uses: ./.github/actions/vibesec-trusted

      - name: Semgrep（vibesec 規則 + OWASP Top Ten + security-audit，diff-aware）
        continue-on-error: ${{ steps.trusted.outputs.shadow == 'true' }}
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          SEMGREP_BASELINE_REF: origin/${{ github.base_ref }}
        run: |
          mkdir -p reports
          BASELINE=""
          if [ -n "${BASE_REF}" ]; then
            git fetch origin "${BASE_REF}" 2>/dev/null || true
            BASELINE="--baseline-commit origin/${BASE_REF}"
          fi
          # --disable-nosem：`# nosemgrep` 寫在一般程式碼裡、不受 CODEOWNERS 把關，PR 作者加一行就能讓發現消失；
          # 例外只能經 blocking-policy 核准（與 scripts/g3_sast.py 對外部專案的處理一致，第一輪審查 C8）
          # --max-target-bytes=0：預設會靜默跳過 >1 MB 的檔案（實測不留任何通知）；改成照掃，逾時則由 sarif_gate 記 incomplete
          semgrep ci --disable-nosem --max-target-bytes=0 \
            --config _trusted/config/semgrep/vibesec-rules.yaml \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --exclude _trusted \
            --sarif --output reports/semgrep.sarif ${BASELINE} || true

      - name: Upload Semgrep SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/semgrep.sarif
          category: vibesec-g3-semgrep

      - name: Upload G3 semgrep artifact（summary 推導 G3 gate JSON 用）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesec-g3-semgrep-reports
          path: reports/
          if-no-files-found: ignore

  # G3 IaC 掃描（Checkov + Trivy config）獨立於 semgrep container 執行
  g3-iac:
    name: G3 IaC（Checkov / Trivy config）
    permissions:
      contents: read
      security-events: write   # upload-sarif
    needs: g2-secrets
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 判定程式、規則、設定與 mode 一律取自 default branch（_trusted/），PR head 只當被掃描的資料；
      # 細節見 .github/actions/vibesec-trusted/action.yml。
      - name: 取出受信任的判定程式與設定（default branch → _trusted/）
        id: trusted
        uses: ./.github/actions/vibesec-trusted

      # Checkov action 在 Docker 容器內以 root 執行；若由它建立 reports/，目錄屬 root，之後以 runner 身分跑的
      # Trivy 會 permission denied、寫不出 SARIF（G3 因此 incomplete）。先以 runner 身分建立目錄。
      - name: 建立 reports/（runner 擁有）
        run: mkdir -p reports

      # checkov 設定檔內的 external-checks-dir／skip-path 是相對路徑：把整個 config/checkov/ 換成 default branch 的版本，
      # 讓設定檔與自訂檢查都來自受信任來源（PR 對 config/checkov 的修改合併後才生效）。
      - name: 套用受信任的 Checkov 設定
        shell: bash
        run: rm -rf config/checkov && cp -r _trusted/config/checkov config/checkov

      # 行內抑制（checkov:skip=…、trivy:ignore:…）寫在受測的 IaC 裡、不受 CODEOWNERS 把關，checkov／trivy 一定採信
      # （實測 Dockerfile 加兩行 checkov:skip，發現 3 筆變 1 筆），兩者也都沒有關閉的選項。工作區只是被掃描的資料：
      # 掃描前把標記改寫成無效字串，作法同 semgrep 的 --disable-nosem（例外只能經 blocking-policy 核准）。
      - name: 停用受測方的行內抑制註解（checkov:skip／trivy:ignore）
        shell: bash
        run: |
          # git grep：0 = 有命中、1 = 沒有命中、其他 = 錯誤 → 中止（不能確認就不掃，G3 IaC 記 incomplete；不吞錯）
          set +e
          git grep -lzIE 'checkov:skip|trivy:ignore' -- . ':(exclude)_trusted' > "$RUNNER_TEMP/vibesec-suppressions.lst"
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then echo "::error::git grep 失敗（exit $rc），無法確認行內抑制註解 → 不執行 IaC 掃描"; exit 1; fi
          while IFS= read -r -d '' f; do
            sed -i -E 's/checkov:skip/checkov-skip-disabled-by-vibesec/g; s/trivy:ignore/trivy-ignore-disabled-by-vibesec/g' -- "$f"
            echo "::warning file=$f::已停用行內抑制註解（checkov:skip／trivy:ignore 不採信；例外只能經 blocking-policy 核准）"
            printf '%s\n' "$f" >> reports/_neutralized-suppressions.txt
          done < "$RUNNER_TEMP/vibesec-suppressions.lst"

      - name: Checkov（IaC → SARIF）
        continue-on-error: true
        uses: bridgecrewio/checkov-action@cc0e17d456ef1713bbfd963ebac19dc776775cb2 # v12.3128.0
        with:
          config_file: config/checkov/.checkov.yaml
          skip_path: _trusted
          output_format: sarif
          output_file_path: reports/

      - name: Upload Checkov SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/results_sarif.sarif
          category: vibesec-g3-checkov

      - name: Trivy config 掃描（IaC misconfig → SARIF）
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0（v0.0.1–v0.34.2 受 CVE-2026-33634 影響）
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: _trusted
          format: sarif
          output: reports/trivy-config.sarif

      - name: Upload Trivy config SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/trivy-config.sarif
          category: vibesec-g3-trivy-config

      - name: Upload G3 IaC artifact（summary 推導 G3 gate JSON 用）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesec-g3-iac-reports
          path: reports/
          if-no-files-found: ignore

  # G4 架構與存取控制（靜態檢查 + PR 留言提示 LLM 審查）
  g4-access-control:
    name: G4 架構與存取控制
    permissions:
      contents: read
      security-events: write   # upload-sarif
      pull-requests: write     # 唯一在 PR 留言的步驟（G4 LLM 審查提醒）
    needs: g3-sast-iac
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # 判定程式、規則、設定與 mode 一律取自 default branch（_trusted/），PR head 只當被掃描的資料；
      # 細節見 .github/actions/vibesec-trusted/action.yml。
      - name: 取出受信任的判定程式與設定（default branch → _trusted/）
        id: trusted
        uses: ./.github/actions/vibesec-trusted

      - name: G4 靜態檢查（Unicode / RLS / Agent tool allow-list / HITL / 單層 middleware / MCP resource indicator）
        id: g4static
        continue-on-error: ${{ steps.trusted.outputs.shadow == 'true' }}
        env:
          VIBESEC_MODE: ${{ steps.trusted.outputs.mode }}
          COMMIT_SHA: ${{ github.sha }}
          VIBESEC_CONFIG: _trusted/vibesec.yaml   # 政策與 vibesec_policy.py 取自 default branch
        run: |
          python3 -I - <<'EOF'
          # G4 靜態檢查：隱形 Unicode（Rules File Backdoor）、Supabase RLS、Agent 工具 allow-list、單層 middleware 授權
          import json, re, pathlib, os, datetime, glob, sys
          NOW = datetime.datetime.now(datetime.timezone.utc)
          def iso(dt): return dt.replace(microsecond=0).isoformat()
          MODE = os.environ.get("VIBESEC_MODE", "shadow")
          # tier 只來自 blocking-policy（含 risk_tier 的 tier_overrides）；VIBESEC_CONFIG 讓 run_evals.py 在暫存目錄執行時也找得到
          ROOT = pathlib.Path(os.environ.get("VIBESEC_CONFIG", "vibesec.yaml")).resolve().parent
          sys.path.insert(0, str(ROOT / "scripts"))
          from vibesec_policy import Policy
          POLICY = Policy(ROOT)
          COMMIT = os.environ.get("COMMIT_SHA", "")[:40] or None
          REPORTS = pathlib.Path("reports"); REPORTS.mkdir(exist_ok=True)
          # _trusted/ 是 default branch 的判定程式副本，不是被掃描的專案內容
          def _skip(p): return str(p).startswith(("_trusted/", "./_trusted/", ".git/")) or "/node_modules/" in str(p)
          # 列檔一律用 os.walk：glob 的 ** 會跳過 .agents/、.cursor/ 等隱藏目錄，PR 把高危工具放進隱藏目錄就看不到
          def _files(*exts):
              out = []
              for root, dirs, files in os.walk("."):
                  dirs[:] = [x for x in dirs if x not in (".git", "node_modules", "_trusted")]
                  for fn in files:
                      if fn.endswith(exts):
                          out.append(os.path.normpath(os.path.relpath(os.path.join(root, fn), ".")).replace(os.sep, "/"))
              return sorted(out)
          # 讀檔失敗（目錄名為 x.sql、指向目錄的 symlink、權限）不得讓整步崩潰而丟掉其他發現；
          # 對應控制記 untested（沒看到內容不等於沒有問題），已有 blocking 發現照樣 fail
          READ_ERR = {}
          def _read(p, ctl):
              try:
                  return pathlib.Path(p).read_text(encoding="utf-8", errors="replace")
              except Exception as e:
                  READ_ERR.setdefault(ctl, []).append(f"{p}（{type(e).__name__}）")
                  return None

          results = []; rules = {}
          def add(rule_id, level, msg, uri, line=1):
              tier = POLICY.tier(rule_id)
              rules.setdefault(rule_id, {"id": rule_id, "name": rule_id,
                                         "shortDescription": {"text": rule_id},
                                         "defaultConfiguration": {"level": level},
                                         "properties": {"policy_tier": tier}})
              results.append({"ruleId": rule_id, "level": level, "message": {"text": msg},
                              "locations": [{"physicalLocation": {"artifactLocation": {"uri": uri},
                                             "region": {"startLine": line}}}],
                              "properties": {"policy_tier": tier}})

          # 1) 隱形 Unicode 掃描
          INVISIBLE = ["\u200b", "\u200c", "\u200d", "\u2060", "\ufeff", "\u00ad"]  # 零寬、WJ、BOM、soft hyphen
          INVISIBLE += [chr(c) for c in range(0x202A, 0x202F)]  # U+202A-U+202E bidi
          INVISIBLE += [chr(c) for c in range(0x2066, 0x206A)]  # U+2066-U+2069 isolates
          INVISIBLE += [chr(c) for c in range(0x2061, 0x2065)]  # U+2061-U+2064 invisible operators
          INVISIBLE += [chr(c) for c in range(0xE0000, 0xE0080)]  # Unicode Tag 字元（可藏 ASCII 指令）
          # 範圍依 docs/05 §6：所有 Markdown（含 .github/copilot-instructions.md、CLAUDE.md、AGENTS.md、SKILL.md）
          # 加上無副檔名的 AI 助理規則檔（Cursor / Windsurf / Cline）
          # 用 os.walk 而非 glob：glob 的 ** 會跳過 .github/、.cursor/ 等隱藏目錄
          RULE_NAMES = {".cursorrules", ".windsurfrules", ".clinerules"}
          rule_files = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [x for x in dirs if x not in (".git", "node_modules", "_trusted")]
              rel_root = os.path.relpath(root, ".")
              in_rules_dir = rel_root.startswith((".cursor/rules", ".clinerules"))
              for fn in files:
                  if fn.endswith((".md", ".mdc")) or fn in RULE_NAMES or in_rules_dir:
                      rule_files.append(os.path.normpath(os.path.join(rel_root, fn)))
          for p in sorted(set(rule_files)):
              fp = pathlib.Path(p)
              if not fp.exists(): continue
              try: lines = fp.read_text(encoding="utf-8", errors="replace").splitlines()
              except Exception: continue
              for i, ln in enumerate(lines, 1):
                  hits = [hex(ord(ch)) for ch in ln if ch in INVISIBLE]
                  if hits:
                      add("vibesec.g4.rules-file-invisible-unicode", "error",
                          f"Rules File Backdoor：{p} 第 {i} 行含隱形 Unicode {hits}", p, i)

          # 2) Supabase migrations RLS
          # 兩個 glob 會重疊（supabase/migrations 也符合 **/migrations）→ 去重，避免同一檔案重複回報
          SQL_MIGRATIONS = 0   # 沒有任何 migration → ASVS5-V8.2 not_applicable（沒有可查的表，不是「已啟用 RLS」）
          for p in [f for f in _files(".sql") if f.startswith("supabase/migrations/") or "/migrations/" in f or f.startswith("migrations/")]:
              if _skip(p): continue
              SQL_MIGRATIONS += 1
              body = _read(p, "ASVS5-V8.2")
              if body is None: continue
              if re.search(r'disable\s+row\s+level\s+security', body, re.I):
                  add("vibesec.g4.supabase-rls-disabled", "error", f"{p} 明確停用 RLS（全表暴露風險）", p, 1)
              for m in re.finditer(r'create\s+table\s+(?:if\s+not\s+exists\s+)?["`]?([A-Za-z0-9_.]+)', body, re.I):
                  tbl = m.group(1)
                  if not re.search(rf'alter\s+table\s+["`]?{re.escape(tbl)}["`]?\s+enable\s+row\s+level\s+security', body, re.I):
                      add("vibesec.g4.supabase-table-without-rls", "warning",
                          f"{p}：資料表 {tbl} 未見 enable row level security", p, 1)

          # Agent 工具註冊脈絡與工具名稱（3) allow-list lint 與 3b) HITL 共用）
          TOOL_CTX = re.compile(r'@(?:\w+\.)?tool\b|register_tool|\btools\s*[=:]|\.tool\(|\btool\(\s*\{', re.I)
          def _tool_names(body):
              """(名稱, 行號)：@tool／@mcp.tool 下一個 def、tools=[…]／tools: […] 清單、YAML tools: 區塊條目、
              register_tool("x")／server.tool("x")、tool({name: "x"})、tools: { x: tool({…}) }（Vercel AI SDK）、
              Tool(name="x")／StructuredTool.from_function(name="x")（LangChain）。"""
              out = []
              lines = body.splitlines()
              for i, ln in enumerate(lines, 1):
                  if re.search(r'@(?:\w+\.)?tool\b', ln):
                      for j in range(i, min(i + 4, len(lines))):
                          m = re.match(r'\s*(?:async\s+)?def\s+(\w+)', lines[j])
                          if m: out.append((m.group(1), j + 1)); break
                  for m in re.finditer(r'\btools\s*[=:]\s*\[([^\]]*)\]', ln):
                      out += [(n, i) for n in re.findall(r'[A-Za-z_][\w-]*', m.group(1))]
                  for m in re.finditer(r'(?:register_tool|\.tool)\(\s*["\']([\w-]+)', ln):
                      out.append((m.group(1), i))
                  for m in re.finditer(r'\bname\s*:\s*["\']([\w-]+)["\']', ln):
                      out.append((m.group(1), i))
                  for m in re.finditer(r'\b([A-Za-z_]\w*)\s*:\s*tool\(', ln):
                      out.append((m.group(1), i))
                  for m in re.finditer(r'(?:\bTool|from_function)\([^)]*?\bname\s*=\s*["\']([\w-]+)', ln):
                      out.append((m.group(1), i))
                  if re.match(r'\s*tools\s*:\s*$', ln):          # YAML 區塊清單：tools:\n  - refund_payment
                      for j in range(i, len(lines)):
                          m = re.match(r'\s*-\s*(?:name\s*:\s*)?["\']?([A-Za-z_][\w-]*)', lines[j])
                          if not m: break
                          out.append((m.group(1), j + 1))
              return out
          # 3) Agent 工具 allow-list lint（高危工具暴露）：只看「註冊給 Agent 的工具名稱」（_tool_names）。
          #    以前只要檔案出現 tool 字樣、且任一處提到 delete_user／execute_sql／drop_table 就報：分類工具名稱的正則、
          #    文件字串、測試資料都會誤報（例如 scripts/llm_observations.py 第 23 行判定高影響工具用的 HIGH_IMPACT，L3 下為 blocking）。
          DANGEROUS = re.compile(r'(delete_user|execute_sql|drop_table)', re.I)
          for p in _files(".py", ".ts", ".js"):
              if _skip(p): continue
              body = _read(p, "VS-G4-AGENT-TOOL-ALLOWLIST")
              if body is None or not TOOL_CTX.search(body): continue
              risky = [(n, i) for n, i in _tool_names(body) if DANGEROUS.search(n)]
              if risky:
                  n, i = risky[0]
                  add("vibesec.g4.agent-tool-overexposure", "warning",
                      f"{p} 第 {i} 行向 Agent 註冊高危工具 {n}（delete_user/execute_sql/drop_table）；應限制 allow-list + HITL", p, i)

          # 3b) 高影響工具缺 Human-in-the-Loop（vibesec.g4.missing-hitl，advisory）— 啟發式，只看單一檔案：
          #     檔案有 Agent 工具註冊脈絡、註冊的工具名稱有高影響動作（金流、刪除、部署、對外送信、改權限），
          #     且同檔案看不到任何人工核准訊號（confirm／approval／HITL／interrupt…）→ 回報。
          #     核准若做在其他檔案（框架設定、gateway）會誤報，所以是 advisory；跨檔確認交 LLM 審查（VS-G4-LLM-REVIEW）。
          HI_TOOL = re.compile(r'(refund|transfer|payout|payment|charge|withdraw|wire|delete|drop|truncate|wipe|purge|destroy|'
                               r'deploy|release|publish|send_(?:email|mail|sms|message)|grant|revoke|set_role)', re.I)
          HITL_SIGNAL = re.compile(r'confirm|approv|human[_ -]?in[_ -]?the[_ -]?loop|\bhitl\b|interrupt\(|ask_user|'
                                   r'require_?(?:human|review)|needs_?review|permission_mode|人工(?:確認|核准)', re.I)
          HITL_FILES = (_files(".py", ".ts", ".js")
                        + [f for f in _files(".yml", ".yaml", ".json")
                           if not f.startswith(".github/")])   # workflow 的 deploy／release job 不是 Agent 工具
          HITL_FILES = [f for f in HITL_FILES if not f.startswith("evals/cases/")]   # 評測 fixture（同 .semgrepignore 的 evals/）
          for p in HITL_FILES:
              if _skip(p): continue
              body = _read(p, "ASVS5-V2.3")
              if body is None: continue
              if not TOOL_CTX.search(body) or HITL_SIGNAL.search(body):
                  continue
              risky = [(n, i) for n, i in _tool_names(body) if HI_TOOL.search(n)]
              if risky:
                  n, i = risky[0]
                  add("vibesec.g4.missing-hitl", "warning",
                      f"{p} 第 {i} 行：Agent 工具 {n} 屬高影響動作，同檔案未見人工核准（confirm／approval／HITL）；"
                      f"請確認執行前有人工確認與稽核（若核准做在其他檔案，於 LLM 審查說明）", p, i)

          # 4) 單層 middleware 授權（CVE-2025-29927 類）— advisory
          for p in [f for f in _files("middleware.ts") if f.rsplit("/", 1)[-1] == "middleware.ts"]:
              if _skip(p): continue
              add("vibesec.g4.single-middleware-authz", "note",
                  f"偵測到 Next.js {p}：請確認授權不只靠單層 middleware（CVE-2025-29927），資料層需獨立 authz", p, 1)

          # 4b) FastAPI／Starlette：授權只做在 app middleware，路由與 router 都沒有授權依賴 → 同一規則（advisory）。
          #     「middleware 做授權」= @app.middleware("http") 函式或 BaseHTTPMiddleware 子類別內有授權訊號；
          #     「路由層授權」= 任何 Security()，或依賴名稱像授權的 Depends()（Depends(get_db) 這類不算）。
          #     只要有路由層授權就不報：那已是兩層，是否涵蓋每條路由交給 LLM 審查（VS-G4-LLM-REVIEW）。
          import ast
          AUTH_SIGNAL = re.compile(r'authori[sz]ation|bearer|token|session|api[_-]?key|unauthori[sz]ed|forbidden|\b40[13]\b|HTTP_40[13]', re.I)
          AUTH_DEP = re.compile(r'auth|user|token|session|principal|permission|scope|login|verify|require|current|guard|role', re.I)
          def _name(n):
              return n.attr if isinstance(n, ast.Attribute) else n.id if isinstance(n, ast.Name) else ""
          mw_hits, route_auth = [], False
          for p in _files(".py"):
              if _skip(p) or "site-packages/" in p or p.startswith(("venv/", ".venv/")): continue
              src = _read(p, "ASVS5-V8.3")
              if src is None: continue
              if not re.search(r'^\s*(from|import)\s+(fastapi|starlette)\b', src, re.M): continue
              try: tree = ast.parse(src)
              except (SyntaxError, ValueError): continue
              funcs = {n.name: n for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
              def _does_auth(node):
                  # middleware 常把判斷交給同檔的 helper（例如 response = await guard(request)）：往下看一層
                  called = {_name(c.func) for c in ast.walk(node) if isinstance(c, ast.Call)}
                  return any(AUTH_SIGNAL.search(ast.get_source_segment(src, n) or "")
                             for n in [node, *(funcs[c] for c in called if c in funcs and funcs[c] is not node)])
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      if any(isinstance(d, ast.Call) and _name(d.func) == "middleware" and d.args
                             and isinstance(d.args[0], ast.Constant) and d.args[0].value == "http" for d in node.decorator_list) \
                              and _does_auth(node):
                          mw_hits.append((p, node.lineno))
                  elif isinstance(node, ast.ClassDef):
                      if any(_name(b) == "BaseHTTPMiddleware" for b in node.bases) and _does_auth(node):
                          mw_hits.append((p, node.lineno))
                  elif isinstance(node, ast.Call):
                      fn = _name(node.func)
                      if fn == "Security" or (fn == "Depends" and node.args and AUTH_DEP.search(_name(node.args[0]))):
                          route_auth = True
          if not route_auth:
              for p, line in mw_hits:
                  add("vibesec.g4.single-middleware-authz", "note",
                      f"FastAPI {p} 第 {line} 行的 middleware 含授權判斷，但沒有任何路由或 router 以 Depends／Security 檢查授權："
                      "middleware 被繞過或路由掛到其他 app 時沒有第二道檢查；路由或服務層需獨立 authz，資料層再加 owner filter", p, line)

          # 5) MCP OAuth 的 RFC 8707 resource indicator（vibesec.yaml static_checks 的 mcp_resource_indicator；docs/05 §7）— advisory。
          #    判定在受信任的 scripts/g4_mcp.py（與本機版 g4_access.py、run_evals.py 共用，只用標準函式庫）。
          #    無法載入或執行（例如 default branch 還沒有這支模組）→ 控制記 untested 並寫進 status_reason，不讓整步崩潰。
          try:
              from g4_mcp import mcp_resource_check, MCP_RULE
              mcp_hits, MCP_COV = mcp_resource_check(pathlib.Path("."))
          except Exception as e:
              mcp_hits, MCP_COV = [], {"control_id": "VS-G4-MCP-RESOURCE-INDICATOR", "state": "untested",
                                       "reason": f"MCP resource indicator 檢查無法執行（scripts/g4_mcp.py：{type(e).__name__}）"}
          for uri, line, msg in mcp_hits:
              add(MCP_RULE, "warning", msg, uri, line)

          sarif = {"$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
                   "version": "2.1.0",
                   "runs": [{"tool": {"driver": {"name": "vibesec-g4-static", "version": "1.0.0",
                                                 "informationUri": "https://github.com/chinchiang/MultiAgentDelta",
                                                 "rules": list(rules.values())}}, "results": results}]}
          (REPORTS / "g4-static.sarif").write_text(json.dumps(sarif, ensure_ascii=False, indent=2), encoding="utf-8")

          blocking = sum(1 for r in results if r["properties"]["policy_tier"] == "blocking")
          advisory = len(results) - blocking
          # 狀態反映發現本身；shadow 只決定是否擋下 merge（見下方 exit 與 job 的 continue-on-error），不把 fail 改寫成 pass。
          # CI 只跑靜態部分；VS-G4-LLM-REVIEW（跨檔授權推理、BOLA/IDOR、HITL）在此仍 pending → G4 最多是 incomplete，
          # 不報 pass（incomplete ≠ pass，CLAUDE.md #2；docs/05「reviewer 缺席 → incomplete 或 pending；不得 pass」）。
          # G4 不在 blocking-policy 的 incomplete_gate_is_blocking_in_enforce，所以 incomplete 不擋 merge；要擋須人類另開 PR 改政策。
          LLM_PENDING = "G4 LLM 審查（VS-G4-LLM-REVIEW）未在 CI 執行，需由 /vibesec-harness 或人工完成"
          def _state(*ids, ctl=None):
              if any(r["ruleId"] in ids for r in results): return "fail"
              return "untested" if ctl in READ_ERR else "pass"
          def _why(ctl):
              return ("無法讀取：" + "、".join(READ_ERR[ctl][:5])) if ctl in READ_ERR else None
          coverage = [
              {"control_id": "VS-G4-RULES-FILE-UNICODE", "state": _state("vibesec.g4.rules-file-invisible-unicode"), "reason": None},
              ({"control_id": "ASVS5-V8.2", "state": _state("vibesec.g4.supabase-rls-disabled", "vibesec.g4.supabase-table-without-rls", ctl="ASVS5-V8.2"), "reason": _why("ASVS5-V8.2")}
               if SQL_MIGRATIONS else
               {"control_id": "ASVS5-V8.2", "state": "not_applicable", "reason": "沒有 supabase／migrations 的 .sql 檔，RLS 靜態檢查無對象"}),
              {"control_id": "ASVS5-V8.3", "state": _state("vibesec.g4.single-middleware-authz", ctl="ASVS5-V8.3"), "reason": _why("ASVS5-V8.3")},
              {"control_id": "VS-G4-AGENT-TOOL-ALLOWLIST", "state": _state("vibesec.g4.agent-tool-overexposure", ctl="VS-G4-AGENT-TOOL-ALLOWLIST"), "reason": _why("VS-G4-AGENT-TOOL-ALLOWLIST")},
              {"control_id": "ASVS5-V2.3", "state": _state("vibesec.g4.missing-hitl", ctl="ASVS5-V2.3"), "reason": _why("ASVS5-V2.3")},
              MCP_COV,
              {"control_id": "VS-G4-LLM-REVIEW", "state": "pending", "reason": "LLM 審查需由 /vibesec-harness 或人工執行"},
          ]
          # 狀態由受信任的 gate_verdict.verdict 判定：blocking → fail；否則 LLM 審查未完成 → incomplete（無法讀取的檔案、
          # MCP 檢查無法執行等 untested 控制一併寫進 status_reason）。下一步 g4_review.py 依審查紀錄重新判定。
          from gate_verdict import verdict
          status, status_reason = verdict(blocking=blocking, coverage=coverage, problems=[LLM_PENDING])
          gate = {"gate": "G4", "status": status, "status_reason": status_reason, "mode": MODE, "scope": "full",
                  "diff_base": None, "commit": COMMIT, "started_at": iso(NOW),
                  "finished_at": iso(datetime.datetime.now(datetime.timezone.utc)),
                  "tools": [{"name": "vibesec-g4-static", "version": "1.0.0", "state": "ran", "exit_code": 0,
                             "output_ref": "reports/g4-static.sarif", "duration_seconds": None}],
                  "findings_count": {"blocking": blocking, "advisory": advisory},
                  "coverage": coverage}
          (REPORTS / "g4-gate.json").write_text(json.dumps(gate, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"G4 static: blocking={blocking} advisory={advisory}")
          if MODE == "enforce" and blocking:
              raise SystemExit(1)
          EOF

      # LLM 審查不在 CI 跑：/vibesec-harness 產出 reports/g4-review.yaml，由人複製為 reviews/g4/<commit>.yaml 提交。
      # 這一步只讀該紀錄（schema、provider／family 一致性、對 PR head 是否過期），把 VS-G4-LLM-REVIEW 從 pending 推進到
      # pass／pending／fail；無有效紀錄維持 incomplete（incomplete ≠ pass）。規則見 docs/05「阻擋政策」與 scripts/g4_review.py。
      - name: 安裝 PyYAML / jsonschema（審查紀錄驗證；雜湊鎖定）
        if: always()
        uses: ./.github/actions/vibesec-pip-install
        with:
          requirements: requirements-ci.txt

      # 職責分離（CLAUDE.md 規則 6）：本 PR 新增／修改的 reviews/g4 紀錄不能自證。取得「在目前 head SHA 上
      # approve、且不是 PR 作者」的帳號（每人只看最後一次 review；之後的 CHANGES_REQUESTED／DISMISSED 會取消）。
      # 查詢失敗 → 空清單 → 紀錄不被信任（fail closed），G4 最高 pending。
      - name: 取得目前 head 上的非作者 approve
        id: approvals
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const reviews = await github.paginate(github.rest.pulls.listReviews,
              {owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100});
            const last = new Map();
            for (const r of reviews) {
              if (!r.user || r.state === 'COMMENTED' || r.state === 'PENDING') continue;
              last.set(r.user.login.toLowerCase(), r);
            }
            const author = pr.user.login.toLowerCase();
            // 只採計有 repo 寫入關係者的核准：公開 repo 上任何帳號都能 approve（第三次 harness 審查 N2）
            const TRUSTED = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const ok = [...last.entries()]
              .filter(([login, r]) => login !== author && r.state === 'APPROVED' && r.commit_id === pr.head.sha
                && TRUSTED.has(r.author_association))
              .map(([login]) => login);
            core.info(`head ${pr.head.sha} 上的非作者 approve：${ok.join(', ') || '（無）'}`);
            core.setOutput('approvers', ok.join(','));

      - name: G4 LLM 審查紀錄（reviews/g4/）→ 閘門狀態
        if: always()
        continue-on-error: ${{ steps.trusted.outputs.shadow == 'true' }}
        env:
          VIBESEC_MODE: ${{ steps.trusted.outputs.mode }}
          # pull_request 的 github.sha 是合併 commit；過期判斷要對 PR head，否則 base 分支的變更也會讓紀錄過期
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          APPROVERS: ${{ steps.approvals.outputs.approvers }}
        run: |
          VIBESEC_PROJECT_ROOT="$GITHUB_WORKSPACE" python3 _trusted/scripts/g4_review.py gate --static reports/g4-gate.json --head "$HEAD_SHA" \
            --base "$BASE_SHA" --pr-author "$PR_AUTHOR" --approvers "$APPROVERS" \
            --out reports/g4-gate.json --comment reports/g4-comment.md --mode "$VIBESEC_MODE"

      - name: Upload G4 static SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/g4-static.sarif
          category: vibesec-g4-static

      - name: Upload G4 reports（gate JSON 供 summary 彙整）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesec-g4-reports
          path: reports/
          if-no-files-found: ignore

      - name: PR 留言：G4 LLM 審查需人工／harness 執行
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- vibesec-g4-llm-review -->';
            // 留言內容由 scripts/g4_review.py gate 產生（含審查紀錄與發現表）；檔案缺席時退回固定提醒
            let body;
            try { body = fs.readFileSync('reports/g4-comment.md', 'utf8'); } catch (e) {
              body = `${marker}\n### VibeSec G4 — 存取控制\n\nG4 靜態檢查已完成（隱形 Unicode / RLS / Agent tool allow-list / HITL / 單層 middleware / MCP resource indicator）。\n\n**G4 狀態：\`incomplete\`**——LLM 審查（VS-G4-LLM-REVIEW）尚未執行，需由 \`/vibesec-harness\` 完成並提交 \`reviews/g4/<commit>.yaml\`（跨檔授權推理、BOLA/IDOR 綁定、跨檔的 HITL 確認無法由靜態規則涵蓋）。目前政策下 G4 incomplete 不擋 merge。`;
            }
            if (!body.includes(marker)) body = `${marker}\n${body}`;
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            // 分頁取全部留言：listComments 預設只回第一頁 30 則，PR 留言超過 30 則就找不到舊留言、每次重發一則新的
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

  # Summary —— 彙整各閘門結果；enforce 且有 blocking 或 blocking 閘門 incomplete → 失敗
  # 倉庫完整性：schema、評測結構與 split、人工裁決紀錄與規則自我測試（scripts/validate.py）。
  # 不是 G1–G4 閘門；任何錯誤都讓這個檢查失敗，不使用 continue-on-error，也不納入 shadow 模式的豁免。
  repo-validate:
    name: 倉庫驗證（validate.py）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # validate.py 與通知腳本測試也取 default branch 的版本（_trusted/）驗 PR head：只跑 PR 自己的版本時，
      # PR 可以先削弱 validate.py 或測試再轉綠（第一輪審查 C1）。ref 的取法與 .github/actions/vibesec-trusted 相同
      # （拿不到 default branch → 指向不存在的 ref，fail closed）；不用該 action，因為它會改寫工作區的忽略清單。
      - name: 取出 default branch 的驗證程式（_trusted/）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch && format('refs/heads/{0}', github.event.repository.default_branch) || 'refs/heads/vibesec-default-branch-unknown' }}
          path: _trusted
          persist-credentials: false
          # validate.py 只從受信任樹 import 判定模組（g4_review 等以自己所在的樹讀 config／schemas），tests/ 用來核對
          # PR 沒有刪掉或清空既有測試；cone mode 也會帶進根目錄的 vibesec.yaml
          sparse-checkout: |
            scripts
            .github/scripts
            config
            schemas
            tests

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # 缺 PyYAML／jsonschema 時 validate.py 只會警告並略過檢查，等於沒驗證（incomplete ≠ pass），所以必須安裝成功。
      # 鎖定檔取自上面的 _trusted/（sparse checkout 的 cone mode 一律包含根目錄檔案），見 .github/actions/vibesec-pip-install
      - name: 安裝 PyYAML / jsonschema（雜湊鎖定）
        uses: ./.github/actions/vibesec-pip-install
        with:
          requirements: requirements-ci.txt

      # 兩個都要過：PR 版本跑得到本 PR 新增的檢查；受信任版本確保既有檢查沒被拿掉。
      # PR 刻意修改既有驗證規則時，受信任版本會以舊規則失敗，須由 owner 審核後合併（CODEOWNERS /scripts/）。
      - name: 執行 validate.py（PR 版本）
        run: python3 scripts/validate.py

      - name: 執行 validate.py（default branch 版本驗 PR head）
        run: |
          # 過渡：引入本檢查的 PR 合併前，default branch 的 validate.py 還不認 VIBESEC_PROJECT_ROOT（會去驗 _trusted/ 本身）
          if ! grep -q VIBESEC_PROJECT_ROOT _trusted/scripts/validate.py; then
            echo "::warning::default branch 的 validate.py 尚不支援 VIBESEC_PROJECT_ROOT，本次只跑 PR 版本"; exit 0
          fi
          VIBESEC_PROJECT_ROOT="$GITHUB_WORKSPACE" python3 _trusted/scripts/validate.py

      # nightly／staging 失敗通知的判定邏輯（開／留言／關 issue、靶場預期狀態）。這兩支只在 main 的排程中執行，
      # 壞掉時不會有人發現，所以在每個 PR 跑單元測試。runner 內建 Node（node:test 需 ≥ 18）；
      # 測試檔清單明列：檔案缺漏時 node 直接失敗，不會變成「0 個測試、通過」。
      # 人工裁決（rulings/*.yaml）的 decided_by 是檔案內自填的，ruling.py 只擋 bot 名稱。PR 作者不得替自己的 PR
      # 寫裁決：本 PR 新增或修改的 ruling，decided_by.handle 必須不是 PR 作者（職責分離，CLAUDE.md 規則 6）。
      # 搭配 .github/CODEOWNERS 要求 rulings/ 由 owner 審核；兩者都要在 branch protection 啟用 code owner review 才完整。
      - name: 人工裁決不得由 PR 作者自填
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # 只有單一維護者的 repo 無法做到職責分離：由 admin 設 Actions 變數 VIBESEC_SINGLE_MAINTAINER=true，
          # 違反時改為明確警告並記錄在 log（不是靜默放行）；未設定時一律失敗。
          SINGLE_MAINTAINER: ${{ vars.VIBESEC_SINGLE_MAINTAINER }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          # --no-renames：預設偵測改名，「rulings/A 改名成 rulings/<目標發現>.yaml 再改內容」會顯示成 R、被 AM 濾掉（第二輪審查 M4）
          git diff --name-only --no-renames --diff-filter=ACMR "$BASE_SHA" HEAD -- 'rulings/*.yaml' > "$RUNNER_TEMP/rulings.txt"
          python3 -I - "$RUNNER_TEMP/rulings.txt" <<'PY'
          import os, sys, yaml
          author = os.environ["PR_AUTHOR"].strip().lower()
          files = [l.strip() for l in open(sys.argv[1]) if l.strip()]
          bad = []
          for f in files:
              try:
                  d = yaml.safe_load(open(f, encoding="utf-8")) or {}
              except Exception as e:
                  bad.append(f"{f}: 無法解析（{type(e).__name__}）"); continue
              handle = str(((d.get("decided_by") or {}).get("handle")) or "").lstrip("@").strip().lower()
              if not handle or handle == author:
                  bad.append(f"{f}: decided_by.handle 為空或等於 PR 作者 @{author}")
          print(f"檢查 {len(files)} 份本 PR 新增／修改的裁決")
          single = os.environ.get("SINGLE_MAINTAINER", "").strip().lower() == "true"
          level = "warning" if single else "error"
          for b in bad:
              print(f"::{level}::{b}" + ("（VIBESEC_SINGLE_MAINTAINER=true：單一維護者，無法職責分離，僅警告）" if single else ""))
          sys.exit(1 if bad and not single else 0)
          PY

      - name: 通知腳本單元測試（node --test）
        run: |
          node --version
          node --test .github/scripts/nightly-issue.test.js .github/scripts/staging-issue.test.js

      # default branch 的測試檔對 PR 的實作再跑一次：PR 不能用削弱測試的方式讓改壞的通知邏輯通過
      - name: 通知腳本單元測試（default branch 的測試檔）
        run: |
          T="$RUNNER_TEMP/trusted-node-tests"; mkdir -p "$T"
          cp .github/scripts/nightly-issue.js .github/scripts/staging-issue.js "$T/"
          cp _trusted/.github/scripts/nightly-issue.test.js _trusted/.github/scripts/staging-issue.test.js "$T/"
          node --test "$T/nightly-issue.test.js" "$T/staging-issue.test.js"

  summary:
    name: VibeSec Summary
    needs: [g1-supply-chain, g2-secrets, g3-sast-iac, g3-iac, g4-access-control]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 下載所有 reports artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: _artifacts

      # 判定程式、規則、設定與 mode 一律取自 default branch（_trusted/），PR head 只當被掃描的資料；
      # 細節見 .github/actions/vibesec-trusted/action.yml。
      - name: 取出受信任的判定程式與設定（default branch → _trusted/）
        id: trusted
        uses: ./.github/actions/vibesec-trusted

      # 與其他 job 相同用 Python 3.11：鎖定檔以 --python-version 3.11 產生（環境標記依此解析）
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # 放在取出 _trusted/ 之後：鎖定檔優先用 default branch 的版本，見 .github/actions/vibesec-pip-install
      - name: 安裝 PyYAML / jsonschema（雜湊鎖定）
        uses: ./.github/actions/vibesec-pip-install
        with:
          requirements: requirements-ci.txt

      # G2、G3 的工具是第三方 action，本身不寫 gate JSON；由此從各 job 上傳的 SARIF 推導。
      # artifact 或 SARIF 缺席 → 該閘門 incomplete（incomplete ≠ pass），不再顯示為 untested。
      - name: 推導 G2 / G3 gate JSON（scripts/sarif_gate.py）
        shell: bash
        run: |
          mkdir -p reports
          A=_artifacts
          python3 _trusted/scripts/sarif_gate.py --gate G2 --tool gitleaks=$A/vibesec-g2-reports/gitleaks.sarif \
            --envcheck $A/vibesec-g2-reports/g2-envcheck.json --out reports/g2-gate.json
          python3 _trusted/scripts/sarif_gate.py --gate G3 --tool semgrep=$A/vibesec-g3-semgrep-reports/semgrep.sarif \
            --tool checkov=$A/vibesec-g3-iac-reports/results_sarif.sarif \
            --tool trivy=$A/vibesec-g3-iac-reports/trivy-config.sarif --out reports/g3-gate.json

      # 判定一律由受信任的 scripts/gate_verdict.py 執行（CONTEXT.md「阻擋判定」、docs/10 §9.1）：PR head 只提供 gate JSON，
      # 先以受信任的 schema 驗證，缺席／無法解析／不符 schema → incomplete；mode 與 blocking-policy 取自 _trusted/。
      # enforce 下：政策列為 incomplete 也擋的閘門未完成，或 mode／政策讀不到 → exit 2（優先）；有 blocking 或狀態為 fail → exit 1。
      - name: 彙整 gate-status 矩陣
        shell: bash
        run: |
          mkdir -p reports
          # 只取各 job 自己上傳的 gate 檔：以前用 find 混抓所有 artifact 裡的同名檔，PR head 的 G1 程式可寫一份假的 g4-gate.json 蓋掉受信任的那份
          [ -f _artifacts/vibesec-g1-reports/g1-gate.json ] && cp _artifacts/vibesec-g1-reports/g1-gate.json reports/g1-gate.json
          [ -f _artifacts/vibesec-g4-reports/g4-gate.json ] && cp _artifacts/vibesec-g4-reports/g4-gate.json reports/g4-gate.json
          rc=0
          python3 _trusted/scripts/gate_verdict.py enforce --trusted-root _trusted \
            --gate G1=reports/g1-gate.json --gate G2=reports/g2-gate.json \
            --gate G3=reports/g3-gate.json --gate G4=reports/g4-gate.json \
            --markdown-out reports/gate-status.md || rc=$?
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f reports/gate-status.md ]; then cat reports/gate-status.md >> "$GITHUB_STEP_SUMMARY"; fi
          case "$rc" in
            0) ;;
            1) echo "::error::enforce 模式下存在 blocking 發現 → exit 1" ;;
            2) echo "::error::enforce 模式下 blocking 閘門 incomplete，或 mode／政策讀不到 → exit 2" ;;
            *) echo "::error::gate_verdict 執行失敗（exit $rc），無法判定 → exit 2"; rc=2 ;;
          esac
          exit "$rc"

      - name: Upload 彙整 reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibesec-pr-summary
          path: reports/
          if-no-files-found: ignore
