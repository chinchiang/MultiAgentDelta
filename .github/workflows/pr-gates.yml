# VibeSec PR 閘門 — G1 供應鏈 / G2 機密 / G3 SAST+IaC / G4 存取控制（diff-aware、白箱）
# 由內而外、每次 pull_request 執行。語意見 docs/08-harness-agent.md。
# 不可違反：incomplete ≠ pass（工具缺席／逾時／API 失敗 → 閘門 incomplete 且絕不通過）。
name: VibeSec PR Gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: vibesec-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # G1 供應鏈與 Slopsquatting —— order: first（惡意 postinstall 於安裝瞬間執行，必須最先跑）
  g1-supply-chain:
    name: G1 供應鏈與 Slopsquatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（full history for diff）
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: 讀取 vibesec.yaml 設定（mode / risk_tier / cooldown_days）
        id: cfg
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, pathlib
          txt = pathlib.Path("vibesec.yaml").read_text(encoding="utf-8")
          def scalar(key, default):
              m = re.search(rf'^\s*{key}\s*:\s*([^\s#]+)', txt, re.M)
              return m.group(1).strip() if m else default
          mode = scalar("mode", "shadow")
          tier = scalar("risk_tier", "L2")
          cooldown = scalar("cooldown_days", "14")
          print(f"mode={mode}")
          print(f"risk_tier={tier}")
          print(f"cooldown_days={cooldown}")
          print(f"shadow={'true' if mode=='shadow' else 'false'}")
          PY

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: 安裝 PyYAML（供 blacklist/allowlist 解析，best-effort）
        continue-on-error: true
        run: pip install pyyaml

      - name: 偵測變更的 manifest 檔
        id: diff
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p reports
          BASE="origin/${BASE_REF}"
          if [ -z "${BASE_REF}" ]; then BASE="HEAD~1"; fi
          [ -n "${BASE_REF}" ] && git fetch origin "${BASE_REF}" 2>/dev/null || true
          CHANGED=$(git diff --name-only "${BASE}...HEAD" 2>/dev/null || git diff --name-only HEAD~1...HEAD)
          echo "$CHANGED" > reports/_changed-files.txt
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "變更檔案："; cat reports/_changed-files.txt

      - name: G1 四層快篩（scripts/g1_slopcheck.py）
        id: slopcheck
        continue-on-error: ${{ steps.cfg.outputs.shadow == 'true' }}
        shell: bash
        env:
          DIFF_BASE: ${{ steps.diff.outputs.base }}
        run: |
          # 與 pre-commit 共用同一支腳本：diff-aware、套用 blocking-policy exceptions、
          # 掃描變更的 agent 規則檔；輸出 SARIF 與 gate-result。exit 1 = blocking、2 = incomplete。
          python3 scripts/g1_slopcheck.py \
            --changed-files reports/_changed-files.txt \
            --base "$DIFF_BASE" \
            --sarif reports/g1-slopcheck.sarif \
            --gate reports/g1-gate.json \
            > reports/g1-slopcheck.json

      - name: Upload SlopCheck SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/g1-slopcheck.sarif
          category: vibesec-g1-slopcheck

      - name: 安裝 Syft（官方 action，釘選 SHA）
        id: syft
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: 安裝 Grype（官方 action，釘選 SHA）
        id: grype
        continue-on-error: true
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      - name: 將 Syft / Grype 加入 PATH
        continue-on-error: true
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
        run: |
          [ -n "$SYFT_CMD" ] && dirname "$SYFT_CMD" >> "$GITHUB_PATH"
          [ -n "$GRYPE_CMD" ] && dirname "$GRYPE_CMD" >> "$GITHUB_PATH"
          true

      - name: 產生 SBOM（Syft CycloneDX）與漏洞掃描（Grype → SARIF）
        id: sbom
        continue-on-error: true
        run: |
          mkdir -p reports
          if command -v syft >/dev/null 2>&1; then
            syft dir:. -o cyclonedx-json=reports/sbom.cdx.json
          else
            echo "syft 缺席 → SBOM incomplete"; echo "syft_missing=true" >> "$GITHUB_OUTPUT"
          fi
          if command -v grype >/dev/null 2>&1 && [ -f reports/sbom.cdx.json ]; then
            grype sbom:reports/sbom.cdx.json -o sarif --file reports/grype.sarif || true
            grype sbom:reports/sbom.cdx.json -o json --file reports/grype.json || true
          else
            echo "grype 缺席或無 SBOM → incomplete"; echo "grype_missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Grype SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/grype.sarif
          category: vibesec-g1-grype

      # KEV feed：先取 nightly 在 main 留下的快取，再嘗試下載最新版；下載失敗就沿用快取
      # （g1_kev.py 的摘要記錄 feed 發布時間，看得出是否用了舊資料）。兩者皆無 → KEV 檢查 incomplete。
      - name: Restore KEV 快取（nightly 富化快取）
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache
          key: vibesec-enrich-pr-${{ github.run_id }}
          restore-keys: |
            vibesec-enrich-

      - name: 下載 CISA KEV feed
        continue-on-error: true
        run: |
          mkdir -p .cache
          if curl -fsSL --retry 3 --max-time 60 -A vibesec-pr -o .cache/kev.new.json \
               https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json; then
            mv .cache/kev.new.json .cache/kev.json
          else
            echo "::warning::KEV feed 下載失敗；沿用快取（若有）"
          fi

      # KEV 命中 → vibesec.g1.kev-hit（blocking），結果併入 g1-gate.json，由 summary 依 mode 決定是否阻擋。
      # 與 slopcheck 相同：shadow 模式下不讓 job 變紅；enforce 模式下命中（exit 1）或 incomplete（exit 2）都會擋。
      - name: G1 KEV 命中（vibesec.g1.kev-hit）
        id: kev
        continue-on-error: ${{ steps.cfg.outputs.shadow == 'true' }}
        run: |
          python3 scripts/g1_kev.py --grype reports/grype.json --kev-feed .cache/kev.json \
            --sarif reports/g1-kev.sarif --json reports/g1-kev.json --merge-gate reports/g1-gate.json

      - name: Upload KEV SARIF
        if: always() && hashFiles('reports/g1-kev.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/g1-kev.sarif
          category: vibesec-g1-kev

      - name: Trivy 檔案系統掃描（vuln → SARIF）
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0（v0.0.1–v0.34.2 受 CVE-2026-33634 影響）
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: reports/trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/trivy-fs.sarif
          category: vibesec-g1-trivy

      - name: Upload G1 reports（artifact）
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vibesec-g1-reports
          path: reports/
          if-no-files-found: ignore

  # G2 機密與金鑰（全 Git 歷史）
  g2-secrets:
    name: G2 機密與金鑰
    needs: g1-supply-chain
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: 讀取 mode
        id: cfg
        shell: bash
        run: |
          MODE=$(awk -F: '/^[[:space:]]*mode[[:space:]]*:/ {gsub(/[[:space:]]|#.*/,"",$2); print $2; exit}' vibesec.yaml)
          echo "mode=${MODE:-shadow}" >> "$GITHUB_OUTPUT"
          echo "shadow=$([ "${MODE:-shadow}" = shadow ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Gitleaks（全歷史）
        continue-on-error: ${{ steps.cfg.outputs.shadow == 'true' }}
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: config/gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: 檢查 .env 是否在 .gitignore 且無已追蹤的 .env 檔
        continue-on-error: ${{ steps.cfg.outputs.shadow == 'true' }}
        shell: bash
        env:
          VIBESEC_MODE: ${{ steps.cfg.outputs.mode }}
        run: |
          mkdir -p reports
          fail=0
          if [ -f .gitignore ] && grep -Eq '(^|/)\.env' .gitignore; then
            echo "OK: .env* 已列入 .gitignore"
          else
            echo "::error::.env* 未列入 .gitignore（require_env_in_gitignore: true）"; fail=1
          fi
          # docs/03 §4：範本 .env.example 不算（只放佔位值、本來就該提交）；其餘 .env* 被追蹤即失敗
          TRACKED=$(git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -Ev '(^|/)\.env\.example$' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::偵測到已追蹤的 .env 檔："; echo "$TRACKED"; fail=1
          else
            echo "OK: 無已追蹤的 .env 檔"
          fi
          echo "{\"gate\":\"G2\",\"rule_id\":\"vibesec.g2.env-not-ignored\",\"env_gitignore_fail\":$fail}" > reports/g2-envcheck.json
          if [ "${VIBESEC_MODE}" = "enforce" ] && [ "$fail" = "1" ]; then exit 1; fi

      - name: Upload Gitleaks SARIF（若產生）
        if: always() && hashFiles('results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: vibesec-g2-gitleaks

  # G3 SAST 與 IaC（diff-aware；跨檔污點分析 + IaC 設定掃描）
  g3-sast-iac:
    name: G3 SAST 與 IaC
    needs: g2-secrets
    if: always()
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: 讀取 mode
        id: cfg
        shell: bash
        run: |
          MODE=$(awk -F: '/^[[:space:]]*mode[[:space:]]*:/ {gsub(/[[:space:]]|#.*/,"",$2); print $2; exit}' vibesec.yaml)
          echo "mode=${MODE:-shadow}" >> "$GITHUB_OUTPUT"
          echo "shadow=$([ "${MODE:-shadow}" = shadow ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Semgrep（vibesec 規則 + OWASP Top Ten + security-audit，diff-aware）
        continue-on-error: ${{ steps.cfg.outputs.shadow == 'true' }}
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          SEMGREP_BASELINE_REF: origin/${{ github.base_ref }}
        run: |
          mkdir -p reports
          BASELINE=""
          if [ -n "${BASE_REF}" ]; then
            git fetch origin "${BASE_REF}" 2>/dev/null || true
            BASELINE="--baseline-commit origin/${BASE_REF}"
          fi
          semgrep ci \
            --config config/semgrep/vibesec-rules.yaml \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --sarif --output reports/semgrep.sarif ${BASELINE} || true

      - name: Upload Semgrep SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/semgrep.sarif
          category: vibesec-g3-semgrep

  # G3 IaC 掃描（Checkov + Trivy config）獨立於 semgrep container 執行
  g3-iac:
    name: G3 IaC（Checkov / Trivy config）
    needs: g2-secrets
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 讀取 mode
        id: cfg
        shell: bash
        run: |
          MODE=$(awk -F: '/^[[:space:]]*mode[[:space:]]*:/ {gsub(/[[:space:]]|#.*/,"",$2); print $2; exit}' vibesec.yaml)
          echo "shadow=$([ "${MODE:-shadow}" = shadow ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Checkov（IaC → SARIF）
        continue-on-error: true
        uses: bridgecrewio/checkov-action@cc0e17d456ef1713bbfd963ebac19dc776775cb2 # v12.3128.0
        with:
          config_file: config/checkov/.checkov.yaml
          output_format: sarif
          output_file_path: reports/

      - name: Upload Checkov SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/results_sarif.sarif
          category: vibesec-g3-checkov

      - name: Trivy config 掃描（IaC misconfig → SARIF）
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0（v0.0.1–v0.34.2 受 CVE-2026-33634 影響）
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: reports/trivy-config.sarif

      - name: Upload Trivy config SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/trivy-config.sarif
          category: vibesec-g3-trivy-config

  # G4 架構與存取控制（靜態檢查 + PR 留言提示 LLM 審查）
  g4-access-control:
    name: G4 架構與存取控制
    needs: g3-sast-iac
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: 讀取 mode
        id: cfg
        shell: bash
        run: |
          MODE=$(awk -F: '/^[[:space:]]*mode[[:space:]]*:/ {gsub(/[[:space:]]|#.*/,"",$2); print $2; exit}' vibesec.yaml)
          echo "mode=${MODE:-shadow}" >> "$GITHUB_OUTPUT"
          echo "shadow=$([ "${MODE:-shadow}" = shadow ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: G4 靜態檢查（Unicode / RLS / Agent tool allow-list / 單層 middleware）
        id: g4static
        continue-on-error: ${{ steps.cfg.outputs.shadow == 'true' }}
        env:
          VIBESEC_MODE: ${{ steps.cfg.outputs.mode }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'EOF'
          # G4 靜態檢查：隱形 Unicode（Rules File Backdoor）、Supabase RLS、Agent 工具 allow-list、單層 middleware 授權
          import json, re, pathlib, os, datetime, glob
          NOW = datetime.datetime.now(datetime.timezone.utc)
          def iso(dt): return dt.replace(microsecond=0).isoformat()
          MODE = os.environ.get("VIBESEC_MODE", "shadow")
          COMMIT = os.environ.get("COMMIT_SHA", "")[:40] or None
          REPORTS = pathlib.Path("reports"); REPORTS.mkdir(exist_ok=True)

          results = []; rules = {}
          def add(rule_id, level, msg, uri, line=1, tier="advisory"):
              rules.setdefault(rule_id, {"id": rule_id, "name": rule_id,
                                         "shortDescription": {"text": rule_id},
                                         "defaultConfiguration": {"level": level},
                                         "properties": {"policy_tier": tier}})
              results.append({"ruleId": rule_id, "level": level, "message": {"text": msg},
                              "locations": [{"physicalLocation": {"artifactLocation": {"uri": uri},
                                             "region": {"startLine": line}}}],
                              "properties": {"policy_tier": tier}})

          # 1) 隱形 Unicode 掃描
          INVISIBLE = ["​", "‌", "‍", "⁠", "﻿", "\u00ad"]  # 零寬、WJ、BOM、soft hyphen
          INVISIBLE += [chr(c) for c in range(0x202A, 0x202F)]  # U+202A-U+202E bidi
          INVISIBLE += [chr(c) for c in range(0x2066, 0x206A)]  # U+2066-U+2069 isolates
          INVISIBLE += [chr(c) for c in range(0x2061, 0x2065)]  # U+2061-U+2064 invisible operators
          INVISIBLE += [chr(c) for c in range(0xE0000, 0xE0080)]  # Unicode Tag 字元（可藏 ASCII 指令）
          # 範圍依 docs/05 §6：所有 Markdown（含 .github/copilot-instructions.md、CLAUDE.md、AGENTS.md、SKILL.md）
          # 加上無副檔名的 AI 助理規則檔（Cursor / Windsurf / Cline）
          # 用 os.walk 而非 glob：glob 的 ** 會跳過 .github/、.cursor/ 等隱藏目錄
          RULE_NAMES = {".cursorrules", ".windsurfrules", ".clinerules"}
          rule_files = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [x for x in dirs if x not in (".git", "node_modules")]
              rel_root = os.path.relpath(root, ".")
              in_rules_dir = rel_root.startswith((".cursor/rules", ".clinerules"))
              for fn in files:
                  if fn.endswith((".md", ".mdc")) or fn in RULE_NAMES or in_rules_dir:
                      rule_files.append(os.path.normpath(os.path.join(rel_root, fn)))
          for p in sorted(set(rule_files)):
              fp = pathlib.Path(p)
              if not fp.exists(): continue
              try: lines = fp.read_text(encoding="utf-8", errors="replace").splitlines()
              except Exception: continue
              for i, ln in enumerate(lines, 1):
                  hits = [hex(ord(ch)) for ch in ln if ch in INVISIBLE]
                  if hits:
                      add("vibesec.g4.rules-file-invisible-unicode", "error",
                          f"Rules File Backdoor：{p} 第 {i} 行含隱形 Unicode {hits}", p, i, "blocking")

          # 2) Supabase migrations RLS
          # 兩個 glob 會重疊（supabase/migrations 也符合 **/migrations）→ 去重，避免同一檔案重複回報
          for p in sorted(set(glob.glob("supabase/migrations/**/*.sql", recursive=True) + glob.glob("**/migrations/**/*.sql", recursive=True))):
              fp = pathlib.Path(p)
              if not fp.exists(): continue
              body = fp.read_text(encoding="utf-8", errors="replace")
              if re.search(r'disable\s+row\s+level\s+security', body, re.I):
                  add("vibesec.g4.supabase-rls-disabled", "error", f"{p} 明確停用 RLS（全表暴露風險）", p, 1, "blocking")
              for m in re.finditer(r'create\s+table\s+(?:if\s+not\s+exists\s+)?["`]?([A-Za-z0-9_.]+)', body, re.I):
                  tbl = m.group(1)
                  if not re.search(rf'alter\s+table\s+["`]?{re.escape(tbl)}["`]?\s+enable\s+row\s+level\s+security', body, re.I):
                      add("vibesec.g4.supabase-table-without-rls", "warning",
                          f"{p}：資料表 {tbl} 未見 enable row level security", p, 1, "advisory")

          # 3) Agent 工具 allow-list lint（高危工具暴露）
          DANGEROUS = r'(delete_user|execute_sql|drop_table)'
          for p in glob.glob("**/*.py", recursive=True) + glob.glob("**/*.ts", recursive=True) + glob.glob("**/*.js", recursive=True):
              if "/node_modules/" in p or p.startswith(".git/"): continue
              fp = pathlib.Path(p)
              try: body = fp.read_text(encoding="utf-8", errors="replace")
              except Exception: continue
              if re.search(r'(tool|register_tool|tools\s*=|@tool)', body) and re.search(DANGEROUS, body, re.I):
                  for i, ln in enumerate(body.splitlines(), 1):
                      if re.search(DANGEROUS, ln, re.I):
                          add("vibesec.g4.agent-tool-overexposure", "warning",
                              f"{p} 第 {i} 行疑似向 Agent 註冊高危工具（delete_user/execute_sql/drop_table）；應限制 allow-list + HITL", p, i, "advisory")
                          break

          # 4) 單層 middleware 授權（CVE-2025-29927 類）— advisory
          for p in glob.glob("**/middleware.ts", recursive=True) + glob.glob("middleware.ts"):
              if "/node_modules/" in p: continue
              add("vibesec.g4.single-middleware-authz", "note",
                  f"偵測到 Next.js {p}：請確認授權不只靠單層 middleware（CVE-2025-29927），資料層需獨立 authz", p, 1, "advisory")

          sarif = {"$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
                   "version": "2.1.0",
                   "runs": [{"tool": {"driver": {"name": "vibesec-g4-static", "version": "1.0.0",
                                                 "informationUri": "https://github.com/chinchiang/MultiAgentDelta",
                                                 "rules": list(rules.values())}}, "results": results}]}
          (REPORTS / "g4-static.sarif").write_text(json.dumps(sarif, ensure_ascii=False, indent=2), encoding="utf-8")

          blocking = sum(1 for r in results if r["properties"]["policy_tier"] == "blocking")
          advisory = len(results) - blocking
          # 狀態反映發現本身；shadow 只決定是否擋下 merge（見下方 exit 與 job 的 continue-on-error），不把 fail 改寫成 pass。
          # CI 只跑靜態部分；VS-G4-LLM-REVIEW（跨檔授權推理、BOLA/IDOR、HITL）在此仍 pending → G4 最多是 incomplete，
          # 不報 pass（incomplete ≠ pass，CLAUDE.md #2；docs/05「reviewer 缺席 → incomplete 或 pending；不得 pass」）。
          # G4 不在 blocking-policy 的 incomplete_gate_is_blocking_in_enforce，所以 incomplete 不擋 merge；要擋須人類另開 PR 改政策。
          LLM_PENDING = "G4 LLM 審查（VS-G4-LLM-REVIEW）未在 CI 執行，需由 /vibesec-harness 或人工完成"
          status = "fail" if blocking else "incomplete"
          status_reason = LLM_PENDING if status == "incomplete" else f"靜態檢查 {blocking} 筆 blocking；另：{LLM_PENDING}"
          def _state(*ids): return "fail" if any(r["ruleId"] in ids for r in results) else "pass"
          gate = {"gate": "G4", "status": status, "status_reason": status_reason, "mode": MODE, "scope": "diff",
                  "diff_base": None, "commit": COMMIT, "started_at": iso(NOW),
                  "finished_at": iso(datetime.datetime.now(datetime.timezone.utc)),
                  "tools": [{"name": "vibesec-g4-static", "version": "1.0.0", "state": "ran", "exit_code": 0,
                             "output_ref": "reports/g4-static.sarif", "duration_seconds": None}],
                  "findings_count": {"blocking": blocking, "advisory": advisory},
                  "coverage": [
                      {"control_id": "VS-G4-RULES-FILE-UNICODE", "state": _state("vibesec.g4.rules-file-invisible-unicode"), "reason": None},
                      {"control_id": "ASVS5-V8.2", "state": _state("vibesec.g4.supabase-rls-disabled", "vibesec.g4.supabase-table-without-rls"), "reason": None},
                      {"control_id": "VS-G4-AGENT-TOOL-ALLOWLIST", "state": _state("vibesec.g4.agent-tool-overexposure"), "reason": None},
                      {"control_id": "VS-G4-LLM-REVIEW", "state": "pending", "reason": "LLM 審查需由 /vibesec-harness 或人工執行"},
                  ]}
          (REPORTS / "g4-gate.json").write_text(json.dumps(gate, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"G4 static: blocking={blocking} advisory={advisory}")
          if MODE == "enforce" and blocking:
              raise SystemExit(1)
          EOF

      - name: Upload G4 static SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/g4-static.sarif
          category: vibesec-g4-static

      - name: PR 留言：G4 LLM 審查需人工／harness 執行
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const marker = '<!-- vibesec-g4-llm-review -->';
            const body = `${marker}\n### VibeSec G4 — 存取控制\n\nG4 靜態檢查已完成（隱形 Unicode / RLS / Agent tool allow-list / 單層 middleware）。\n\n**G4 狀態：\`incomplete\`**——LLM 審查（VS-G4-LLM-REVIEW）尚未執行，需由 \`/vibesec-harness\` 或人工完成（跨檔授權推理、BOLA/IDOR 綁定、HITL 判斷無法由靜態規則涵蓋）。目前政策下 G4 incomplete 不擋 merge。`;
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({owner, repo, issue_number});
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

  # Summary —— 彙整各閘門結果；enforce 且有 blocking 或 blocking 閘門 incomplete → 失敗
  # 倉庫完整性：schema、評測結構與 split、人工裁決紀錄與規則自我測試（scripts/validate.py）。
  # 不是 G1–G4 閘門；任何錯誤都讓這個檢查失敗，不使用 continue-on-error，也不納入 shadow 模式的豁免。
  repo-validate:
    name: 倉庫驗證（validate.py）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      # 缺 PyYAML／jsonschema 時 validate.py 只會警告並略過檢查，等於沒驗證（incomplete ≠ pass），所以必須安裝成功。
      - name: 安裝 PyYAML / jsonschema
        run: pip install pyyaml jsonschema

      - name: 執行 validate.py
        run: python3 scripts/validate.py

  summary:
    name: VibeSec Summary
    needs: [g1-supply-chain, g2-secrets, g3-sast-iac, g3-iac, g4-access-control]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 下載所有 reports artifact
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: _artifacts

      - name: 彙整 gate-status 矩陣
        shell: bash
        run: |
          MODE=$(awk -F: '/^[[:space:]]*mode[[:space:]]*:/ {gsub(/[[:space:]]|#.*/,"",$2); print $2; exit}' vibesec.yaml)
          mkdir -p reports
          find _artifacts -name 'g*-gate.json' -exec cp {} reports/ \; 2>/dev/null || true
          python3 - "$MODE" <<'EOF'
          import json, glob, os, sys, pathlib
          MODE = sys.argv[1] if len(sys.argv) > 1 else "shadow"
          BLOCKING_GATES = {"G1", "G2", "G3"}  # blocking 閘門：其 incomplete → exit 2
          rows = []; fail = False; incomplete_block = False
          seen = {}
          for p in sorted(glob.glob("reports/*-gate.json")):
              try: g = json.load(open(p, encoding="utf-8"))
              except Exception: continue
              seen[g.get("gate")] = g
          out = ["# VibeSec 閘門狀態", "", f"模式：`{MODE}`", "",
                 "| 閘門 | 狀態 | blocking | advisory | 說明 |", "|---|---|---|---|---|"]
          for gid in ["G1", "G2", "G3", "G4"]:
              g = seen.get(gid)
              if not g:
                  out.append(f"| {gid} | `untested` | - | - | 未產生 gate 結果 |")
                  continue
              st = g.get("status", "untested")
              fc = g.get("findings_count", {})
              reason = g.get("status_reason") or ""
              out.append(f"| {gid} | `{st}` | {fc.get('blocking','-')} | {fc.get('advisory','-')} | {reason} |")
              if MODE == "enforce":
                  if st == "fail" or (fc.get("blocking", 0) or 0) > 0:
                      fail = True
                  if st == "incomplete" and gid in BLOCKING_GATES:
                      incomplete_block = True
          out += ["", "> incomplete ≠ pass：工具缺席／逾時／API 失敗的閘門不視為通過。"]
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          text = "\n".join(out)
          if summary_path:
              open(summary_path, "a", encoding="utf-8").write(text + "\n")
          print(text)
          pathlib.Path("reports/gate-status.md").write_text(text + "\n", encoding="utf-8")
          if MODE == "enforce" and incomplete_block:
              print("::error::enforce 模式下 blocking 閘門 incomplete → exit 2"); sys.exit(2)
          if MODE == "enforce" and fail:
              print("::error::enforce 模式下存在 blocking 發現 → exit 1"); sys.exit(1)
          EOF

      - name: Upload 彙整 reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vibesec-pr-summary
          path: reports/
          if-no-files-found: ignore
