# Dependabot：讓已釘選 SHA 的 GitHub Actions 自動收到升級 PR。 / Dependabot opens updates for GitHub Actions pinned by SHA.
# 背景：trivy-action 停在 v0.33.1，落入 CVE-2026-33634（CISA KEV）範圍，直到 nightly 的 KEV 檢查才發現。 / Background: trivy-action remained at v0.33.1 within CVE-2026-33634's CISA KEV scope until nightly detection.
# Dependabot 會維持「完整 SHA + # 版本」的釘選格式，與 vibesec.g3.actions-unpinned-action 相容。 / Dependabot preserves full SHA plus version comments, compatible with vibesec.g3.actions-unpinned-action.
# 升級 PR 照常跑 pr-gates（G1–G4）；不得因為是機器人 PR 就跳過閘門（CLAUDE.md 規則 1）。 / Bot upgrade PRs still run G1–G4 pr-gates; never bypass gates under CLAUDE.md rule 1.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Taipei
    # 與 vibesec.yaml G1 cooldown_days（14）一致：新版本發布滿 14 天才提版本升級， / Matches G1 cooldown_days=14 in vibesec.yaml; propose versions after 14 days.
    # 降低「剛發布就被竄改的版本」流入的機會。安全性更新（Dependabot security updates）不受 cooldown 限制。 / This reduces newly compromised release exposure; Dependabot security updates are exempt from cooldown.
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"
    open-pull-requests-limit: 5
