# VibeSec 主設定檔 — Vibe Coding 六道資安閘門（G0–G6）
# 由 harness agent（.claude/skills/vibesec-harness）與 GitHub Actions 工作流共同讀取。
# 詳細語意見 docs/08-harness-agent.md。

version: 1

# shadow：所有閘門只報告、不阻擋合併（試點預設）
# enforce：命中 blocking 政策的發現會讓 PR 檢查失敗
mode: shadow

# 由 G0 威脅建模決定；影響啟用的閘門與深度（docs/01-g0-threat-modeling.md）
#   L1：純內部、不含 LLM、不處理個資       → 只跑 G1、G2
#   L2：對外或處理業務資料的一般企業應用      → G1–G6 全開
#   L3：對外＋個資／商業機密＋高權限 Agent    → G1–G6 全開且深度加倍，外加委外滲透與正式威脅建模
risk_tier: L2

project:
  name: example-project
  owner: appsec-team
  threat_model: docs/templates/threat-model.yaml   # G0 輸入；不存在時 G0 記為 incomplete
  contains_llm: true                                # 為 false 時 G6 記為 not_applicable（附理由）
  languages: [python, javascript]

reports_dir: reports
policy_file: config/policy/blocking-policy.yaml
providers_file: config/providers.yaml
catalogs_dir: config/catalogs

# 每個閘門：enabled、timeout_seconds、diff_aware（PR 階段只掃變更）、tools（依序嘗試，缺席即 incomplete）
gates:
  g0_threat_model:
    enabled: true
    trigger: [design, major_change, agent_introduction]
    methodologies: [STRIDE, MAESTRO]      # 隱私領域加 LINDDUN
    lethal_trifecta_check: required       # 三要素同時成立 → 必須在設計期切斷一隻腳
  g1_supply_chain:
    enabled: true
    timeout_seconds: 600
    diff_aware: true
    order: first                          # 惡意 postinstall 會在安裝瞬間執行，G1 必須最先跑
    cooldown_days: 14                     # 7–14；發布未滿此天數的新套件版本拒絕安裝
    min_weekly_downloads: 1000
    popular_lists: [config/slopsquat/popular-npm.txt, config/slopsquat/popular-pypi.txt]
    blacklist: config/slopsquat/blacklist.yaml
    allowlist: config/slopsquat/allowlist.yaml
    scan_agent_rule_files: [".cursorrules", "AGENTS.md", "SKILL.md", "**/*.md"]
    sbom_format: cyclonedx-json
    tools: [syft, grype, trivy]
    enrich: [epss, kev]
  g2_secrets:
    enabled: true
    timeout_seconds: 300
    diff_aware: false                     # 全 Git 歷史
    tools: [gitleaks]
    config: config/gitleaks.toml
    require_env_in_gitignore: true
  g3_sast_iac:
    enabled: true
    timeout_seconds: 900
    diff_aware: true
    tools: [semgrep, checkov, trivy-config]
    semgrep_rules: [config/semgrep/vibesec-rules.yaml, p/owasp-top-ten, p/security-audit]
    semgrep_taint_mode: true
    nightly_full: [codeql]
  g4_access_control_review:
    enabled: true
    timeout_seconds: 900
    diff_aware: true
    static_checks: [owner_binding, supabase_rls, single_middleware_authz, agent_tool_allowlist, rules_file_unicode, mcp_resource_indicator]
    llm_review: true
    roles: [architecture, identity-authz]
    high_impact_actions_require_hitl: true
  g5_dast_api:
    enabled: true
    timeout_seconds: 1800
    stage: staging
    target_url_env: VIBESEC_TARGET_URL
    tools: [zap-baseline, zap-api-scan, api-probes]
    two_account_test: required            # 需要兩個不同權限帳號的 token
    account_a_token_env: VIBESEC_TOKEN_A
    account_b_token_env: VIBESEC_TOKEN_B
    checks: [bola_idor, jwt_alg_none, jwt_alg_confusion, ssrf_metadata, swagger_exposed, graphql_introspection, debug_stacktrace, rate_limit]
  g6_ai_red_team:
    enabled: true
    timeout_seconds: 1800
    stage: staging
    tools: [promptfoo, garak]
    promptfoo_config: config/promptfoo/promptfooconfig.yaml      # redteam 生成層（需 ANTHROPIC_API_KEY 或 OPENAI_API_KEY）
    promptfoo_tests_config: config/promptfoo/tests.yaml          # 決定性測試（不需金鑰）
    garak_config: config/garak/vibesec.probes.yaml
    checks: [direct_prompt_injection, indirect_prompt_injection, system_prompt_extraction, stored_xss_via_ai_output, denial_of_wallet]

review:
  enabled: true
  roles: [architecture, appsec, identity-authz, supplychain-cicd]
  min_families_for_high_risk: 2           # 高風險控制至少兩個不同模型家族獨立檢查
  round1_independent: true                # 第一輪不交換結論
  max_cross_rounds: 2                     # 之後最多兩輪交叉質疑
  keep_minority_opinions: true
  majority_vote: false                    # 不採多數決，交人工裁決
  ids_from_catalogs_only: true            # CWE/CVE/ASVS ID 只能引用 catalogs，不得由模型猜測

scoring:
  cvss_version: "4.0"
  record_epss: true
  record_kev: true
  combine_scores: false                   # 不做 CVSS × EPSS × 信心 的自訂乘法
  priority_sla_days: {P0: 0, P1: 7, P2: 30, P3: 90}

output:
  sarif: reports/vibesec.sarif
  findings: reports/findings.json
  risk_register: reports/risk_register.json
  summary: reports/summary.md
  upload_code_scanning: true
